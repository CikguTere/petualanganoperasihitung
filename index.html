<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batik Matika - Petualangan Numerasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling & Optimasi Sentuhan untuk Layar Interaktif */
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111827; /* gray-900 */
            -webkit-tap-highlight-color: transparent;
        }
        .font-nunito {
            font-family: 'Nunito', sans-serif;
        }

        /* Animasi Kustom */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Custom Scrollbar untuk Papan Peringkat */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
    </style>

    <!-- Babel Standalone untuk kompilasi JSX di Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map untuk mengatasi Error Resolving Module -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- Script Utama Game (React + Firebase) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as lucideReact from 'lucide-react';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // Destrukturisasi Ikon
        const { Play, Users, Trophy, ArrowLeft, Heart, Zap, Lock, School, Clock, Lightbulb, Bomb, Maximize, Minimize, Swords, User, MapPin, Medal, Flame, Map: MapIcon, ChevronRight, Store, CalendarCheck, CheckCircle2, LogOut } = lucideReact;

        // ==========================================
        // 1. DATA & KONFIGURASI
        // ==========================================

        const AVATARS = [
            { id: 'default', icon: '👤', name: 'Standar', price: 0 },
            { id: 'owl', icon: '🦉', name: 'Burung Hantu', price: 1000 },
            { id: 'fox', icon: '🦊', name: 'Rubah Cerdik', price: 2500 },
            { id: 'tiger', icon: '🐯', name: 'Harimau Berani', price: 4000 },
            { id: 'panda', icon: '🐧', name: 'Panda Santai', price: 5000 },
            { id: 'dragon', icon: '🐉', name: 'Naga Emas', price: 10000 },
        ];

        const QUEST_TEMPLATES = [
            { id: 'q_solo', type: 'play_solo', target: 2, reward: 500, title: 'Main 2x Mode Solo' },
            { id: 'q_duel', type: 'play_duel', target: 1, reward: 800, title: 'Main 1x Mode Duel' },
            { id: 'q_bomb', type: 'use_bomb', target: 1, reward: 300, title: 'Gunakan 1x Bom' },
            { id: 'q_correct', type: 'answer_correct', target: 20, reward: 1000, title: 'Jawab 20 Soal Benar' },
        ];

        const BATIKS = [
            { id: 'siger', islandId: 1, name: 'Mahkota Siger', price: 0, mathConcept: 'Geometri: Simetri Lipat', pattern: 'siger', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 100 },
            { id: 'durianpecah', islandId: 1, name: 'Durian Pecah', price: 1000, mathConcept: 'Pecahan & Sudut', pattern: 'durian', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 150 },
            { id: 'ikantumbal', islandId: 1, name: 'Ikan Tumbal', price: 3000, mathConcept: 'Translasi Bangun', pattern: 'ikan', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 200 },
            { id: 'kawung', islandId: 2, name: 'Kawung', price: 0, mathConcept: 'Pola Lingkaran Berpotongan', pattern: 'circles', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 150 },
            { id: 'megamendung', islandId: 2, name: 'Megamendung', price: 2000, mathConcept: 'Kurva & Skala Bertingkat', pattern: 'clouds', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 200 },
            { id: 'parang', islandId: 2, name: 'Parang Rusak', price: 4500, mathConcept: 'Garis Sejajar & Gradien', pattern: 'diagonal', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 250 },
            { id: 'batanggaring', islandId: 3, name: 'Batang Garing', price: 0, mathConcept: 'Pohon Faktor (Perkalian)', pattern: 'tree', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 200 },
            { id: 'mandau', islandId: 3, name: 'Mandau', price: 2500, mathConcept: 'Garis Tegak Lurus', pattern: 'sword', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 250 },
            { id: 'singabarong', islandId: 4, name: 'Singa Barong', price: 0, mathConcept: 'Rotasi Bangun Datar', pattern: 'lion', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 250 },
            { id: 'ulundanu', islandId: 4, name: 'Ulun Danu', price: 3000, mathConcept: 'Refleksi Sumbu X', pattern: 'temple', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 300 },
            { id: 'kudasumba', islandId: 5, name: 'Kuda Sumba', price: 0, mathConcept: 'Deret Aritmatika', pattern: 'horse', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 300 },
            { id: 'mamuli', islandId: 5, name: 'Mamuli Rote', price: 4000, mathConcept: 'Geometri Fraktal', pattern: 'jewelry', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 350 },
        ];

        const ISLANDS = [
            { id: 1, name: "Sumatra", desc: "Penjumlahan Dasar", icon: "🌴", color: "from-emerald-400 to-green-600", align: "justify-start" },
            { id: 2, name: "Jawa", desc: "Penjumlahan & Pengurangan", icon: "🌋", color: "from-blue-400 to-indigo-600", align: "justify-end" },
            { id: 3, name: "Kalimantan", desc: "Pengenalan Perkalian", icon: "🦧", color: "from-amber-400 to-orange-600", align: "justify-start" },
            { id: 4, name: "Bali", desc: "Operasi Pembagian", icon: "🌺", color: "from-pink-400 to-rose-600", align: "justify-end" },
            { id: 5, name: "NTT", desc: "Ujian Maestro Nusantara", icon: "🦎", color: "from-purple-400 to-violet-600", align: "justify-center" },
        ];

        const RANKS = [
            { min: 0, title: "Pemula Batik", color: "text-slate-600", bg: "bg-slate-100" },
            { min: 1000, title: "Pengrajin Muda", color: "text-green-600", bg: "bg-green-100" },
            { min: 5000, title: "Ahli Canting", color: "text-blue-600", bg: "bg-blue-100" },
            { min: 15000, title: "Maestro Batik", color: "text-purple-600", bg: "bg-purple-100" },
        ];

        // ==========================================
        // 2. HELPER COMPONENTS
        // ==========================================

        const getPlayerKey = (name, school, province) => {
            const safeName = (name || 'anonim').toLowerCase().replace(/[^a-z0-9]/g, '');
            const safeSchool = (school || '-').toLowerCase().replace(/[^a-z0-9]/g, '');
            const safeProv = (province || '-').toLowerCase().replace(/[^a-z0-9]/g, '');
            return `${safeName}_${safeSchool}_${safeProv}`;
        };

        const FloatingText = ({ text, x, y, onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(onComplete, 1000);
                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <div style={{ left: x, top: y, position: 'absolute', transform: 'translateX(-50%)', zIndex: 50, pointerEvents: 'none' }}>
                    <div style={{ animation: 'floatUp 1s ease-out forwards', textShadow: '0 2px 4px rgba(0,0,0,0.5)' }} className="text-2xl md:text-3xl lg:text-4xl font-black text-white whitespace-nowrap">{text}</div>
                </div>
            );
        };

        const CantingEmas = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <path d="M4 20L11 13" stroke="#B45309" strokeWidth="3" strokeLinecap="round"/>
                <circle cx="15" cy="9" r="5" fill="#FBBF24" stroke="#B45309" strokeWidth="2"/>
                <path d="M19 7C20.5 5.5 22 6 23 8" stroke="#FBBF24" strokeWidth="2.5" strokeLinecap="round"/>
            </svg>
        );

        // ==========================================
        // 3. MAIN COMPONENT
        // ==========================================

        function App() {
            // Global States
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [leaderboardData, setLeaderboardData] = useState([]);
            const [view, setView] = useState('loading');
            const [loginForm, setLoginForm] = useState({ name: '', province: '', school: '' });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [dailyPopup, setDailyPopup] = useState({ show: false, streak: 0, bonus: 0, quests: [] });
            
            const timerRef = useRef(null);
            
            // Single Player States
            const [activeBatik, setActiveBatik] = useState(BATIKS[0]);
            const [level, setLevel] = useState(1);
            const [grid, setGrid] = useState([]);
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(60); 
            const [feverTimer, setFeverTimer] = useState(0); 
            const [lives, setLives] = useState(3);
            const [combo, setCombo] = useState(0);
            const [selectedBlock, setSelectedBlock] = useState(null);
            const [inputAnswer, setInputAnswer] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [powerups, setPowerups] = useState({ bomb: 3, hint: 5 }); // Default aman
            const [floatingTexts, setFloatingTexts] = useState([]);

            const scoreRef = useRef(0);
            const userDataRef = useRef(userData);
            
            useEffect(() => { scoreRef.current = score; }, [score]);
            useEffect(() => { userDataRef.current = userData; }, [userData]);

            // Multiplayer States
            const [mpSetup, setMpSetup] = useState({ p1Name: 'Pemain 1', p2Name: 'Pemain 2', level: 2, timeLimit: 300 });
            const [mpState, setMpState] = useState({
                p1: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                p2: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                timer: 300, winner: null
            });

            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'batik-matika-vfinal';
            
            useEffect(() => {
                if (!firebaseConfig) { setView('landing'); return; }
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else { await signInAnonymously(auth); }
                    } catch (error) { console.error("Auth error", error); setView('landing'); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) {
                        setView('landing');
                        // Otomatis buat sesi baru yang bersih saat pemain log out
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            signInWithCustomToken(auth, __initial_auth_token).catch(console.error);
                        } else { 
                            signInAnonymously(auth).catch(console.error); 
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !firebaseConfig) return;
                const db = getFirestore();
                
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const unsubProfile = onSnapshot(profileRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        // Mencegah auto-login loop: Jika status profil ditandai keluar, tetap di landing
                        if (data.isLoggedOut) {
                            setView('landing');
                        } else {
                            setUserData(data);
                            // Cek Quest ketika user load data (otomatis panggil pop-up misi)
                            checkDailyLogin(data);
                            setView(v => (v === 'loading' || v === 'login' || v === 'landing') ? 'menu' : v);
                        }
                    } else { setView('landing'); }
                });

                // Sinkronisasi Leaderboard Murni
                const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const unsubLb = onSnapshot(lbRef, (snap) => {
                    const rawData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    const uniquePlayersMap = new Map();
                    rawData.forEach(player => {
                        if (!player.name || player.name.toLowerCase().trim() === 'anonim') return;
                        
                        const key = `${player.name}_${player.school}_${player.province}`.toLowerCase().trim();
                        if (!uniquePlayersMap.has(key) || uniquePlayersMap.get(key).points < (player.points || 0)) {
                            uniquePlayersMap.set(key, player);
                        }
                    });
                    
                    const data = Array.from(uniquePlayersMap.values());
                    data.sort((a, b) => (b.points || 0) - (a.points || 0));
                    setLeaderboardData(data);
                }, (err) => console.error("Leaderboard Error:", err));

                return () => { unsubProfile(); unsubLb(); };
            }, [user]);

            // --- SISTEM SATU PINTU LOGIKA POIN (Absolute Pointing) ---
            const addPoints = async (amount) => {
                if (amount <= 0 || !user || !firebaseConfig) return;
                const db = getFirestore();
                
                const currentData = userDataRef.current || {};
                const newTotalPoints = (currentData.points || 0) + amount;

                // Update UI Lokal Langsung
                setUserData(prev => ({ ...prev, points: newTotalPoints }));

                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                
                const pName = currentData.name || loginForm.name || 'Anonim';
                const pSchool = currentData.school || loginForm.school || '-';
                const pProv = currentData.province || loginForm.province || '-';
                const pKey = getPlayerKey(pName, pSchool, pProv);
                
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                
                try {
                    // Update Profil Personal
                    await setDoc(profileRef, { points: newTotalPoints, updatedAt: serverTimestamp() }, { merge: true });
                    
                    // Update Leaderboard dengan Nilai Absolut yang sama Persis
                    await setDoc(publicRef, {
                        name: pName,
                        school: pSchool,
                        province: pProv,
                        unlockedLevel: currentData.unlockedLevel || 1,
                        avatar: currentData.activeAvatar || 'default',
                        points: newTotalPoints, 
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                } catch (e) { console.error("Point Sync Error", e); }
            };

            const saveUserData = async (newData) => {
                if (!user || !firebaseConfig) { setUserData(prev => ({ ...prev, ...newData })); return; }
                const db = getFirestore();
                
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, { ...newData, updatedAt: serverTimestamp() }, { merge: true });
                    // Save ini tidak menyentuh poin Leaderboard, hanya profil & quest.
                } catch (e) { console.error("Save Data Error", e); }
            };

            const checkDailyLogin = (data) => {
                const today = new Date().toDateString();
                const yesterdayDate = new Date();
                yesterdayDate.setDate(yesterdayDate.getDate() - 1);
                const yesterday = yesterdayDate.toDateString();

                let updates = {};
                let needUpdate = false;
                let showPopup = false;
                let currentStreak = data.loginStreak || 0;
                let currentBonus = 0;
                let currentQuests = data.quests || QUEST_TEMPLATES.map(q => ({ ...q, progress: 0, claimed: false }));

                if (data.lastLoginDate !== today) {
                    updates.lastLoginDate = today;
                    if (data.lastLoginDate === yesterday) { currentStreak += 1; } else { currentStreak = 1; }
                    updates.loginStreak = currentStreak;
                    currentBonus = currentStreak * 50;
                    
                    showPopup = true;
                    needUpdate = true;
                }

                if (data.lastQuestDate !== today) {
                    updates.lastQuestDate = today;
                    currentQuests = QUEST_TEMPLATES.map(q => ({ ...q, progress: 0, claimed: false }));
                    updates.quests = currentQuests;
                    needUpdate = true;
                }

                if (needUpdate) {
                    saveUserData(updates);
                    if (currentBonus > 0) {
                        // Jalankan setelah state reda agar sinkron sempurna
                        setTimeout(() => addPoints(currentBonus), 500);
                    }
                }
                if (showPopup) setDailyPopup({ show: true, streak: currentStreak, bonus: currentBonus, quests: currentQuests });
            };

            const updateQuestProgress = (questType, amount = 1) => {
                const currentData = userDataRef.current;
                if (!currentData || !currentData.quests) return;
                let hasChanges = false;
                const newQuests = currentData.quests.map(q => {
                    if (q.type === questType && !q.claimed && q.progress < q.target) {
                        hasChanges = true;
                        return { ...q, progress: Math.min(q.target, q.progress + amount) };
                    }
                    return q;
                });
                if (hasChanges) saveUserData({ quests: newQuests });
            };

            const claimQuest = (questId) => {
                const currentData = userDataRef.current;
                if (!currentData) return;
                const questIndex = currentData.quests.findIndex(q => q.id === questId);
                if (questIndex === -1) return;
                const quest = currentData.quests[questIndex];
                
                if (quest.progress >= quest.target && !quest.claimed) {
                    const newQuests = [...currentData.quests];
                    newQuests[questIndex].claimed = true;
                    saveUserData({ quests: newQuests });
                    addPoints(quest.reward); // Poin misi dikirim lurus ke addPoints!
                    alert(`🎉 Misi Selesai!\nMendapat +${quest.reward} Poin.`);
                }
            };

            // Tombol AKSI KELUAR untuk menyimpan poin game
            const handleSaveAndExit = () => {
                if(scoreRef.current > 0) addPoints(scoreRef.current);
                setScore(0);
                setView('map');
            };

            const handleSaveAndReplay = () => {
                if(scoreRef.current > 0) addPoints(scoreRef.current);
                setScore(0);
                startGame(activeBatik.id, level);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginForm.name || !loginForm.school || !loginForm.province) {
                    alert("Harap lengkapi Nama, Sekolah, dan Provinsi!");
                    return;
                }

                // Cek rekam jejak. Jika sudah ada, muat sisa poinnya!
                const pKey = getPlayerKey(loginForm.name, loginForm.school, loginForm.province);
                const pastRecord = leaderboardData.find(p => p.id === pKey);

                const recoveredPoints = pastRecord?.points || 0;
                const recoveredLevel = pastRecord?.unlockedLevel || 1;
                const recoveredAvatar = pastRecord?.avatar || 'default';

                const initData = { 
                    name: loginForm.name, school: loginForm.school, province: loginForm.province, 
                    points: recoveredPoints, unlockedLevel: recoveredLevel, 
                    activeAvatar: recoveredAvatar, ownedAvatars: ['default', recoveredAvatar],
                    ownedBatiks: [], powerups: { bomb: 3, hint: 5 },
                    lastLoginDate: null, lastQuestDate: null, // Paksa checkDailyLogin memunculkan pop-up misi
                    isLoggedOut: false // Hapus status logout
                };
                
                await saveUserData(initData);
                // Fungsi checkDailyLogin otomatis berjalan via listener onSnapshot untuk memunculkan pop-up hadiah
                setView('menu');
            };

            const handleLogout = async () => {
                // Logical Logout: Tidak memutus sesi auth untuk mencegah loop token
                if (user && firebaseConfig) {
                    const db = getFirestore();
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, { isLoggedOut: true }); // Timpa status untuk mencegah auto-masuk
                }

                // Bersihkan semua state memori pemain sebelumnya agar popup & form reset bersih
                setUserData(null);
                setDailyPopup({ show: false, streak: 0, bonus: 0, quests: [] });
                setLoginForm({ name: '', province: '', school: '' });
                setScore(0);
                
                // Langsung arahkan ke halaman login
                setView('landing');
            };

            const buyBatik = (batik) => {
                const currentPoints = userData?.points || 0;
                if (currentPoints >= batik.price) {
                    const newPoints = currentPoints - batik.price;
                    const newOwned = [...(userData?.ownedBatiks || []), batik.id];
                    saveUserData({ points: newPoints, ownedBatiks: newOwned });
                    addPoints(0); // Sync minus
                    alert(`Berhasil membuka Motif ${batik.name}!`);
                } else { alert("Poin kamu belum cukup untuk membeli motif ini."); }
            };

            const buyAvatar = (avatar) => {
                const currentPoints = userData?.points || 0;
                if (currentPoints >= avatar.price) {
                    const newPoints = currentPoints - avatar.price;
                    const newOwned = [...(userData?.ownedAvatars || ['default']), avatar.id];
                    saveUserData({ points: newPoints, ownedAvatars: newOwned, activeAvatar: avatar.id });
                    addPoints(0); // Sync minus
                    alert(`Berhasil mendapatkan Profil ${avatar.name}!`);
                } else { alert("Poin kamu belum cukup untuk mendapatkan profil ini."); }
            };

            const equipAvatar = (avatarId) => { saveUserData({ activeAvatar: avatarId }); };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                    setIsFullscreen(true);
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); setIsFullscreen(false); }
                }
            };

            const generateQuestion = (lvl) => {
                let types = ['add'];
                if (lvl >= 2) types.push('sub'); 
                if (lvl >= 3) types.push('mul'); 
                if (lvl >= 4) types.push('div'); 
                
                const type = types[Math.floor(Math.random() * types.length)];
                let n1, n2, ans, text;
                
                if (type === 'add') {
                    n1 = Math.floor(Math.random() * (10 + lvl * 10)) + (5 * lvl); 
                    n2 = Math.floor(Math.random() * (10 + lvl * 10)) + 5;
                    ans = n1 + n2; text = `${n1} + ${n2}`;
                } else if (type === 'sub') {
                    n1 = Math.floor(Math.random() * (20 + lvl * 10)) + (10 * lvl); 
                    n2 = Math.floor(Math.random() * n1) + 1;
                    ans = n1 - n2; text = `${n1} - ${n2}`;
                } else if (type === 'mul') {
                    const maxFactor = 4 + lvl; 
                    n1 = Math.floor(Math.random() * maxFactor) + 2; 
                    n2 = Math.floor(Math.random() * maxFactor) + 2;
                    ans = n1 * n2; text = `${n1} × ${n2}`;
                } else {
                    const maxDivisor = 3 + lvl; 
                    n2 = Math.floor(Math.random() * maxDivisor) + 2; 
                    ans = Math.floor(Math.random() * 10) + 2;
                    n1 = n2 * ans; text = `${n1} ÷ ${n2}`;
                }
                return { text, ans };
            };

            const generateGrid = (lvl) => {
                return Array(16).fill(null).map((_, i) => ({
                    id: i, active: true, isSpecial: Math.random() > 0.85, q: generateQuestion(lvl)
                }));
            };

            useEffect(() => {
                if (view === 'game') {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                updateQuestProgress('play_solo'); 
                                setView('gameover');
                                return 0;
                            }
                            return prev - 1;
                        });
                        setFeverTimer(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [view]);

            const startGame = (batikId, selectedLvl) => {
                const batik = BATIKS.find(b => b.id === batikId);
                setActiveBatik(batik);
                setLevel(selectedLvl); 
                setScore(0); setCombo(0); setLives(3);
                setTimeLeft(60 + (selectedLvl * 5)); 
                setFeverTimer(0);
                
                // Amankan Powerups saat mulai main
                setPowerups(userDataRef.current?.powerups || { bomb: 3, hint: 5 });
                
                setGrid(generateGrid(selectedLvl)); setSelectedBlock(null);
                setView('game');

            const submitAnswer = (e) => {
                if (!selectedBlock) return;
                const isCorrect = parseInt(inputAnswer) === selectedBlock.q.ans;

                if (isCorrect) {
                    setFeedback('correct');
                    const newCombo = combo + 1; 
                    setCombo(newCombo);
                    
                    updateQuestProgress('answer_correct'); 
                    
                    let isTriggeringFever = false;
                    let currentFever = feverTimer;
                    if (newCombo === 5 && currentFever === 0) {
                        setFeverTimer(10);
                        currentFever = 10;
                        isTriggeringFever = true;
                        setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `🔥 BATIK FEVER! 🔥`, x: window.innerWidth/2, y: 150 }]);
                    }

                    let earned = activeBatik.baseScore;
                    if (selectedBlock.isSpecial) earned *= 2;
                    if (newCombo > 2) earned += (newCombo * 10);
                    if (currentFever > 0) earned *= 3;
                    
                    setScore(s => s + earned);
                    setTimeLeft(prev => prev + 3);
                    
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `+${earned} (+3s)`, x: window.innerWidth/2, y: window.innerHeight/2 }]);

                    setTimeout(() => {
                        const newGrid = [...grid];
                        newGrid[newGrid.findIndex(b => b.id === selectedBlock.id)].active = false;
                        setGrid(newGrid); setSelectedBlock(null); setFeedback(null); setInputAnswer('');
                        
                        if (newGrid.filter(b => b.active).length === 0) {
                            const bonus = timeLeft * 10 + lives * 50; 
                            const totalLevelScore = score + bonus + earned; 
                            setScore(totalLevelScore); // Poin direkap ke state score
                            
                            updateQuestProgress('play_solo'); 
                            
                            const currentUnlocked = userDataRef.current?.unlockedLevel || 1;
                            const nextLevel = level + 1;
                            if (nextLevel > currentUnlocked && nextLevel <= ISLANDS.length) {
                                saveUserData({ unlockedLevel: nextLevel });
                            }
                            setView('win'); // Layar Menang Muncul -> Tombol Keluar Hadir
                        }
                    }, 500);

                } else {
                    setFeedback('wrong'); setCombo(0); setLives(l => l - 1); setFeverTimer(0);
                    setTimeLeft(prev => Math.max(0, prev - 5));
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `❌ -5 Detik`, x: window.innerWidth/2, y: window.innerHeight/2 }]);
                    setTimeout(() => { 
                        setFeedback(null); 
                        setInputAnswer(''); 
                        if (lives <= 1) { 
                            updateQuestProgress('play_solo'); 
                            setView('gameover'); 
                        } 
                    }, 800);
                }
            };

            const startMultiplayer = () => {
                setMpState({
                    p1: { score: 0, lives: 3, grid: generateGrid(mpSetup.level), activeBlock: null, input: '', feedback: null },
                    p2: { score: 0, lives: 3, grid: generateGrid(mpSetup.level), activeBlock: null, input: '', feedback: null },

                const player = mpState[pKey];

                        return newState;

                                </div>
                                <div>
                                    <label className="block text-sm md:text-base font-black text-gray-700 mb-2 flex items-center gap-2"><MapPin size={18}/> Asal Provinsi</label>
                                    <input required type="text" className="w-full px-5 py-3 md:py-4 text-base md:text-lg bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-orange-500 focus:ring-0 outline-none transition-colors font-bold text-gray-800" placeholder="Misal: Jawa Tengah" value={loginForm.province} onChange={e => setLoginForm({...loginForm, province: e.target.value})} />
                                </div>

                    return (

                    const powerupsValue = powerups || { hint: 0, bomb: 0 };

                    return (
                        <div className={`min-h-[100dvh] flex flex-col items-center relative overflow-y-auto font-nunito p-4 md:p-8 transition-colors duration-500 ${bgClass}`} style={{ touchAction: 'none', userSelect: 'none', WebkitUserSelect: 'none' }}>
                            <FullscreenButton />
                            {floatingTexts.map(ft => ( <FloatingText key={ft.id} text={ft.text} x={ft.x} y={ft.y} onComplete={() => setFloatingTexts(prev => prev.filter(t => t.id !== ft.id))} /> ))}

                            {isFever && (
                                <div className="w-full max-w-lg md:max-w-2xl lg:max-w-4xl bg-black/30 rounded-full h-3 md:h-4 mb-4 md:mb-6 overflow-hidden backdrop-blur-sm border border-yellow-300 shadow-[0_0_20px_rgba(250,204,21,0.6)]">
                                    <div className="h-full bg-yellow-400 shadow-[0_0_10px_#fff]" style={{ width: `${(feverTimer/10)*100}%`, transition: 'width 1s linear' }}></div>
                                </div>
                            )}

                            <div className="w-full max-w-lg md:max-w-2xl lg:max-w-4xl flex flex-col h-full flex-1 gap-2 md:gap-4 lg:gap-6 pb-4 lg:flex-row items-center justify-center">
                                {/* Header */}
                                <div className="w-full lg:w-auto flex flex-col gap-4">
                                    <div className={`p-3 md:p-4 lg:p-6 rounded-[2rem] flex flex-row lg:flex-col justify-between items-center shadow-2xl border-b-8 lg:border-r-8 lg:border-b-0 ${isFever ? 'bg-yellow-900/80 border-yellow-950 backdrop-blur-md' : 'bg-gray-800 border-gray-950'}`}>
                                        <div className="flex lg:flex-col gap-1 md:gap-2 text-red-500">
                                            {[...Array(3)].map((_, i) => <Heart key={i} fill={i < lives ? "currentColor" : "none"} className={`w-8 h-8 md:w-10 md:h-10 ${i >= lives ? "text-white/20" : ""}`} />)}
                                        </div>
                                        <div className="text-center my-2 lg:my-6">
                                            <div className={`text-sm md:text-base lg:text-lg font-bold uppercase tracking-widest flex items-center justify-center gap-2 ${isFever ? 'text-yellow-200' : 'text-gray-400'}`}>
                                                <span>Pulau {currentIsland.name}</span>
                                            </div>
                                            <div className="text-4xl md:text-5xl lg:text-6xl font-black text-white">{score}</div>
                                            {isFever && <div className="text-xs md:text-sm font-black text-yellow-300 animate-pulse mt-1">🔥 x3 POINT 🔥</div>}
                                        </div>
                                        <div className={`px-4 py-2 md:px-6 md:py-3 rounded-2xl flex items-center gap-2 border-b-4 lg:border-b-0 lg:border-r-4 ${isFever ? 'bg-red-600 border-red-800' : 'bg-gray-700 border-gray-900'}`}>
                                            {isFever ? <Flame className="w-6 h-6 md:w-8 md:h-8 text-yellow-300 fill-yellow-300 animate-bounce"/> : <Clock className={`w-6 h-6 md:w-8 md:h-8 ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-yellow-400'}`}/>}
                                            <span className={`font-black text-2xl md:text-3xl ${timeLeft <= 10 && !isFever ? 'text-red-500' : 'text-white'}`}>{timeLeft}s</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Area Bermain */}
                                <div className="flex-1 flex flex-col justify-center items-center relative w-full mt-2 lg:mt-0">
                                    {!selectedBlock ? (
                                        <div className={`shadow-2xl relative border-8 rounded-[2rem] p-3 md:p-4 lg:p-5 ${isFever ? 'bg-orange-600 border-yellow-400' : 'bg-gray-800 border-gray-700'}`}
                                             style={{ width: '100%', maxWidth: 'min(600px, 60vh)', aspectRatio: '1/1' }}>
                                            <div className="absolute inset-3 md:inset-5 lg:inset-6 rounded-2xl bg-cover bg-center opacity-80" style={{ backgroundImage: `url(${activeBatik.bgImage})`}}></div>
                                            <div className="grid grid-cols-4 grid-rows-4 gap-2 w-full h-full relative z-10">
                                                {grid.map(b => (
                                                    <button key={b.id} onPointerDown={(e) => { e.preventDefault(); if(b.active) { setSelectedBlock(b); setInputAnswer(''); setFeedback(null); }}}
                                                        className={`rounded-xl transition-all transform flex items-center justify-center font-bold text-2xl md:text-3xl lg:text-4xl shadow-[0_6px_0_rgba(0,0,0,0.3)] active:shadow-none active:translate-y-1 select-none
                                                            ${!b.active ? 'opacity-0 pointer-events-none scale-50' : 'opacity-100 scale-100'}
                                                            ${b.isSpecial ? 'bg-gradient-to-br from-yellow-400 to-amber-500' : (isFever ? 'bg-gradient-to-br from-red-500 to-orange-500' : 'bg-gradient-to-br from-blue-400 to-blue-600')}`}>
                                                        {b.active && (b.isSpecial ? <span className="text-white drop-shadow-md">★</span> : <span className="text-white/30 text-lg md:text-2xl">?</span>)}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-white rounded-[2rem] p-4 md:p-6 lg:p-8 shadow-2xl w-full max-w-sm md:max-w-xl lg:max-w-2xl border-4 border-gray-200">
                                            <div className="flex justify-between items-center mb-4 md:mb-6">
                                                <button onPointerDown={(e) => { e.preventDefault(); setSelectedBlock(null); }} className="text-gray-400 bg-gray-100 p-3 md:p-4 rounded-full hover:bg-gray-200 select-none"><ArrowLeft className="w-6 h-6 md:w-8 md:h-8"/></button>
                                                <div className="text-4xl md:text-5xl lg:text-6xl font-black text-gray-800 tracking-wider text-center flex-1">
                                                    {selectedBlock.q.text} = <span className={`inline-block min-w-[80px] md:min-w-[120px] text-center border-b-8 pb-2 ${feedback === 'wrong' ? 'border-red-500 text-red-500' : 'border-blue-500 text-blue-600'}`}>{inputAnswer || '?'}</span>
                                                </div>
                                            </div>
                                            <div className="flex justify-center gap-4 mb-4 md:mb-6">
                                                <button onPointerDown={(e) => { e.preventDefault(); if(powerupsValue.hint>0){ setInputAnswer(selectedBlock.q.ans.toString()); setPowerups(p=>({...p, hint: p.hint-1}))} }} disabled={powerupsValue.hint <= 0} className="flex items-center gap-2 bg-green-100 text-green-700 px-4 md:px-6 py-2 md:py-3 rounded-full font-bold text-sm md:text-base lg:text-lg disabled:opacity-50 select-none">
                                                    <Lightbulb className="w-5 h-5 md:w-6 md:h-6"/> Petunjuk ({powerupsValue.hint})
                                                </button>
                                                <button onPointerDown={(e) => { e.preventDefault(); if(powerupsValue.bomb>0){ updateQuestProgress('use_bomb'); setInputAnswer(selectedBlock.q.ans.toString()); setPowerups(p=>({...p, bomb: p.bomb-1})); setTimeout(()=>submitAnswer(e), 100); } }} disabled={powerupsValue.bomb <= 0} className="flex items-center gap-2 bg-red-100 text-red-700 px-4 md:px-6 py-2 md:py-3 rounded-full font-bold text-sm md:text-base lg:text-lg disabled:opacity-50 select-none">
                                                    <Bomb className="w-5 h-5 md:w-6 md:h-6"/> Bom ({powerupsValue.bomb})
                                                </button>
                                            </div>
                                            {renderNumpad(inputAnswer, setInputAnswer, submitAnswer, false, true)}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (view === 'gameover' || view === 'win') {
                    const isWin = view === 'win';
                    const currentIsland = ISLANDS[level - 1] || ISLANDS[0];
                    return (
                        <div className={`min-h-[100dvh] flex flex-col items-center justify-center p-6 md:p-10 font-nunito ${isWin ? 'bg-green-50' : 'bg-red-50'} overflow-y-auto`}>
                            <div className="bg-white p-8 md:p-12 lg:p-16 rounded-[3rem] shadow-2xl max-w-sm md:max-w-2xl w-full text-center border-4 border-gray-100 my-auto">
                                <div className="text-8xl md:text-9xl mb-6 md:mb-10">{isWin ? '🏝️' : (timeLeft <= 0 ? '⏰' : '💥')}</div>
                                <h2 className={`text-4xl md:text-5xl lg:text-6xl font-black mb-4 ${isWin ? 'text-green-600' : 'text-red-600'}`}>
                                    {isWin ? `PULAU ${currentIsland.name.toUpperCase()} SELESAI!` : (timeLeft <= 0 ? 'WAKTU HABIS!' : 'YAH, GAGAL...')}
                                </h2>
                                <p className="text-gray-600 font-bold text-lg md:text-xl lg:text-2xl mb-8 md:mb-12">
                                    {isWin ? 'Luar biasa! Kamu berhasil menaklukkan tantangan di pulau ini.' : 'Poin akan dicatat saat kamu menekan tombol KELUAR di bawah.'}
                                </p>
                                
                                <div className="bg-gray-50 rounded-[2rem] p-6 md:p-10 mb-8 md:mb-12 border-2 border-gray-100">
                                    <p className="text-base md:text-lg lg:text-xl font-bold text-gray-400 uppercase tracking-widest mb-2">Skor Akhir</p>
                                    <p className="text-6xl md:text-7xl lg:text-8xl font-black text-orange-500">{score}</p>
                                </div>

                                <div className="flex flex-col md:flex-row gap-4">
                                    {!isWin && (
                                        <button onClick={handleSaveAndReplay} className="flex-1 bg-orange-500 text-white py-5 md:py-6 rounded-2xl md:rounded-[2rem] font-black text-xl md:text-2xl shadow-[0_8px_0_rgb(194,65,12)] hover:bg-orange-600 active:shadow-[0_0px_0_rgb(194,65,12)] active:translate-y-2 transition-all">
                                            ULANGI LEVEL
                                        </button>
                                    )}
                                    <button onClick={handleSaveAndExit} className="flex-1 bg-gray-800 text-white py-5 md:py-6 rounded-2xl md:rounded-[2rem] font-black text-xl md:text-2xl shadow-[0_8px_0_rgb(17,24,39)] hover:bg-gray-900 active:shadow-[0_0px_0_rgb(17,24,39)] active:translate-y-2 transition-all">
                                        KELUAR & SIMPAN
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (view === 'skin-select') {
                    const ownedIds = userData?.ownedBatiks || [];
                    const currentIsland = ISLANDS[level - 1] || ISLANDS[0];
                    const islandBatiks = BATIKS.filter(b => b.islandId === level);

                    return (
                        <div className="min-h-[100dvh] bg-gray-50 p-4 md:p-8 font-nunito flex flex-col items-center overflow-y-auto">
                            <FullscreenButton />
                            <div className="w-full max-w-lg md:max-w-4xl lg:max-w-6xl my-auto py-8">
                                <div className="flex items-center gap-4 md:gap-6 mb-8 md:mb-12">
                                    <button onClick={() => setView('map')} className="p-4 bg-white rounded-full shadow-sm text-gray-600 hover:bg-gray-100"><ArrowLeft size={28}/></button>
                                    <div>
                                        <h2 className="text-3xl md:text-4xl lg:text-5xl font-black text-gray-800">Motif {currentIsland.name}</h2>
                                        <p className="font-bold text-gray-500 mt-1">Pilih motif batik daerah untuk dimainkan</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                                    {islandBatiks.map(b => {
                                        const isOwned = b.price === 0 || ownedIds.includes(b.id);
                                        return (
                                            <div key={b.id} 
                                                onClick={() => { if(isOwned) startGame(b.id, level) }}
                                                className={`p-6 rounded-[2rem] border-4 text-left flex flex-col items-start gap-4 transition-all ${isOwned ? 'bg-white border-orange-200 hover:border-orange-500 shadow-xl hover:-translate-y-2 cursor-pointer' : 'bg-gray-100 border-gray-200 opacity-90'}`}>
                                                <div className="w-full aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative" style={{ backgroundImage: `url(${b.bgImage})`, backgroundSize: 'cover', backgroundPosition: 'center' }}>
                                                    {!isOwned && <div className="absolute inset-0 bg-black/40 flex items-center justify-center backdrop-blur-sm"><Lock size={48} className="text-white opacity-80"/></div>}
                                                </div>
                                                <div className="w-full flex-1 flex flex-col justify-between">
                                                    <div>
                                                        <h3 className="font-black text-2xl md:text-3xl text-gray-800 mb-1">{b.name}</h3>
                                                        <p className="text-sm md:text-base font-bold text-gray-400 mb-4">{b.mathConcept}</p>
                                                    </div>
                                                    
                                                    {isOwned ? (
                                                        <span className="text-sm md:text-base font-black bg-orange-100 text-orange-600 px-4 py-3 rounded-xl flex items-center justify-center w-full">Siap Pakai</span>
                                                    ) : (
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); buyBatik(b); }}
                                                            className={`px-4 py-3 rounded-xl font-black text-sm md:text-base flex items-center justify-between w-full transition-all ${
                                                                (userData?.points || 0) >= b.price 
                                                                ? 'bg-amber-500 text-white hover:bg-amber-600 active:scale-95 shadow-[0_4px_0_rgb(180,83,9)] active:shadow-none active:translate-y-1' 
                                                                : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                                            }`}
                                                        >
                                                            <span className="flex items-center gap-2"><Lock size={18}/> Buka Motif</span>
                                                            <span>{b.price.toLocaleString()} Poin</span>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                }

                return <div className="p-4 text-center font-nunito">Memuat Komponen Game...</div>;
            };

            return (
                <React.Fragment>
                    {dailyPopup.show && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-[2rem] p-6 md:p-8 max-w-md w-full text-center shadow-2xl transform transition-all animate-bounce-in border-4 border-amber-200">
                                <div className="text-6xl md:text-7xl mb-2">🎁</div>
                                <h2 className="text-3xl md:text-4xl font-black text-amber-500 mb-2">Hadiah Harian!</h2>
                                <p className="text-gray-600 font-bold mb-4">Terima kasih sudah kembali belajar hari ini.</p>
                                
                                <div className="bg-amber-50 rounded-2xl p-4 mb-4 border-2 border-amber-200 flex flex-col items-center">
                                    <div className="flex justify-center items-center gap-2 mb-1">
                                        <Flame className="text-orange-500" size={28}/>
                                        <span className="font-black text-orange-600 text-2xl">{dailyPopup.streak} Hari Streak!</span>
                                    </div>
                                    <p className="text-sm font-bold text-amber-700/70 uppercase">Bonus Poin Langsung</p>
                                    <p className="text-5xl font-black text-amber-500">+{dailyPopup.bonus}</p>
                                </div>

                                <div className="text-left bg-teal-50 rounded-2xl p-4 mb-6 border-2 border-teal-100">
                                    <p className="text-sm font-black text-teal-700 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <CalendarCheck size={18}/> Misi Hari Ini
                                    </p>
                                    <ul className="space-y-3">
                                        {dailyPopup.quests.slice(0, 3).map((q, i) => (
                                            <li key={i} className="flex items-start gap-2 text-sm md:text-base font-bold text-gray-700">
                                                <span className="text-teal-500 shrink-0">❖</span> 
                                                <span className="flex-1 leading-tight">{q.title}</span> 
                                                <span className="text-orange-500 bg-orange-100 px-2 py-0.5 rounded-md text-xs whitespace-nowrap shrink-0">+{q.reward} Poin</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <button 
                                    onClick={() => setDailyPopup({ ...dailyPopup, show: false })}
                                    className="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white py-4 rounded-xl font-black text-xl shadow-[0_6px_0_rgb(180,83,9)] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wider"
                                >
                                    Siap Berpetualang!
                                </button>
                            </div>
                        </div>
                    )}
                    {renderView()}
                </React.Fragment>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
