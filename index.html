<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batik Matika - Petualangan Numerasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling & Optimasi Sentuhan untuk Layar Interaktif */
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111827; /* gray-900 */
            -webkit-tap-highlight-color: transparent;
        }
        .font-nunito {
            font-family: 'Nunito', sans-serif;
        }

        /* Animasi Kustom */
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.2); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Custom Scrollbar untuk Papan Peringkat */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        .dir-rtl { direction: rtl; }
    </style>

    <!-- Babel Standalone untuk kompilasi JSX di Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map untuk mengatasi Module Resolving -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- Script Utama Game (React + Firebase) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, signOut } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, serverTimestamp, increment, writeBatch } from 'firebase/firestore';
        import { Play, Users, Trophy, ArrowLeft, Heart, Zap, Lock, School, Clock, Lightbulb, Bomb, Maximize, Minimize, Swords, User, MapPin, Medal, Flame, Map as MapIcon, ChevronRight, LogOut, Search, CalendarCheck } from 'lucide-react';

        // ==========================================
        // 1. DATA & KONFIGURASI
        // ==========================================

        const AVATARS = [
            { id: 'default', icon: '👤', name: 'Standar', price: 0 },
            { id: 'owl', icon: '🦉', name: 'Burung Hantu', price: 1000 },
            { id: 'fox', icon: '🦊', name: 'Rubah Cerdik', price: 2500 },
            { id: 'tiger', icon: '🐯', name: 'Harimau Berani', price: 4000 },
            { id: 'panda', icon: '🐧', name: 'Panda Santai', price: 5000 },
            { id: 'dragon', icon: '🐉', name: 'Naga Emas', price: 10000 },
        ];

        const BATIKS = [
            // PULAU 1: SUMATRA (MUDAH)
            { id: 'siger', islandId: 1, name: 'Mahkota Siger', price: 0, mathConcept: 'Penjumlahan', pattern: 'siger', bgImage: 'https://github.com/user-attachments/assets/6bdde0b1-211e-4d78-8c9d-19a7afaa44e5', baseScore: 100 },
            { id: 'ikantumbal', islandId: 1, name: 'Ikan Tumbal', price: 1000, mathConcept: 'Penjumlahan Cepat', pattern: 'ikan', bgImage: 'https://github.com/user-attachments/assets/ab955825-d5d4-4b50-a958-9f47105482e4', baseScore: 150 },
            
            // PULAU 2: JAWA (SEDANG)
            { id: 'kawung', islandId: 2, name: 'Kawung', price: 0, mathConcept: 'Penjumlahan & Pengurangan', pattern: 'circles', bgImage: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Batik_Kawung.JPG/600px-Batik_Kawung.JPG', baseScore: 200 },
            { id: 'megamendung', islandId: 2, name: 'Mega Mendung', price: 2000, mathConcept: 'Pengurangan Lanjut', pattern: 'clouds', bgImage: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Batik_Megamendung.jpg/600px-Batik_Megamendung.jpg', baseScore: 250 },
            { id: 'parang', islandId: 2, name: 'Parang', price: 4000, mathConcept: 'Operasi Campur Sedang', pattern: 'diagonal', bgImage: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Batik_Parang_Rusak.jpg/600px-Batik_Parang_Rusak.jpg', baseScore: 300 },
            
            // PULAU 3: SUMBA NTT (SULIT)
            { id: 'karaja', islandId: 3, name: 'Karaja', price: 0, mathConcept: 'Dasar Perkalian', pattern: 'horse', bgImage: 'https://images.unsplash.com/photo-1603504380196-857ea7f71120?auto=format&fit=crop&q=80&w=600', baseScore: 350 },
            { id: 'kaliuda', islandId: 3, name: 'Kaliuda', price: 5000, mathConcept: 'Perkalian & Pembagian', pattern: 'jewelry', bgImage: 'https://images.unsplash.com/photo-1581023773172-e1d9046da8ea?auto=format&fit=crop&q=80&w=600', baseScore: 400 },
            { id: 'pahikung', islandId: 3, name: 'Pahikung', price: 8000, mathConcept: 'Operasi Campur Sulit', pattern: 'temple', bgImage: 'https://images.unsplash.com/photo-1518599904199-0ca897819ddb?auto=format&fit=crop&q=80&w=600', baseScore: 500 },
        ];

        const ISLANDS = [
            { id: 1, name: "Sumatra", desc: "Tingkat Mudah", icon: "🌴", color: "from-emerald-400 to-green-600", align: "justify-start" },
            { id: 2, name: "Jawa", desc: "Tingkat Sedang", icon: "🌋", color: "from-blue-400 to-indigo-600", align: "justify-center" },
            { id: 3, name: "Sumba NTT", desc: "Tingkat Sulit", icon: "🦎", color: "from-amber-400 to-orange-600", align: "justify-end" },
        ];

        const RANKS = [
            { min: 0, title: "Pemula Batik", color: "text-slate-600", bg: "bg-slate-100" },
            { min: 3000, title: "Pengrajin Batik", color: "text-green-600", bg: "bg-green-100" },
            { min: 10000, title: "Pakar Batik", color: "text-amber-600", bg: "bg-amber-100" },
        ];

        // ==========================================
        // 2. HELPER COMPONENTS & ANIMATIONS
        // ==========================================

        const getPlayerKey = (name, school, province) => {
            const safeName = (name || 'anonim').toLowerCase().replace(/[^a-z0-9]/g, '');
            const safeSchool = (school || '-').toLowerCase().replace(/[^a-z0-9]/g, '');
            const safeProv = (province || '-').toLowerCase().replace(/[^a-z0-9]/g, '');
            return `${safeName}_${safeSchool}_${safeProv}`;
        };

        const FloatingText = ({ text, x, y, onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(onComplete, 1500); 
                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <div className="absolute z-50 text-2xl md:text-4xl font-black text-white pointer-events-none drop-shadow-[0_0_15px_rgba(0,0,0,0.8)] whitespace-nowrap"
                     style={{ left: x, top: y, animation: 'floatUp 1.5s ease-out forwards', transform: 'translateX(-50%)' }}>
                    {text}
                </div>
            );
        };

        const CantingEmas = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <path d="M4 20L11 13" stroke="#B45309" strokeWidth="3" strokeLinecap="round"/>
                <circle cx="15" cy="9" r="5" fill="#FBBF24" stroke="#B45309" strokeWidth="2"/>
                <path d="M19 7C20.5 5.5 22 6 23 8" stroke="#FBBF24" strokeWidth="2.5" strokeLinecap="round"/>
            </svg>
        );

        // ==========================================
        // 3. MAIN COMPONENT
        // ==========================================

        function App() {
            // --- Global States ---
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [leaderboardData, setLeaderboardData] = useState([]);
            const [view, setView] = useState('loading');
            const [loginForm, setLoginForm] = useState({ name: '', province: '', school: '' });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [dailyPopup, setDailyPopup] = useState({ show: false, streak: 0, bonus: 0 });
            
            // --- Mobile Blocker State ---
            const [isMobile, setIsMobile] = useState(window.innerWidth < 1024);
            
            const timerRef = useRef(null);
            
            // --- Single Player States ---
            const [activeBatik, setActiveBatik] = useState(BATIKS[0]);
            const [level, setLevel] = useState(1);
            const [grid, setGrid] = useState([]);
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(60); 
            const [feverTimer, setFeverTimer] = useState(0); 
            const [lives, setLives] = useState(3);
            const [combo, setCombo] = useState(0);
            const [selectedBlock, setSelectedBlock] = useState(null);
            const [inputAnswer, setInputAnswer] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [powerups, setPowerups] = useState({ bomb: 3, hint: 5 }); 
            const [floatingTexts, setFloatingTexts] = useState([]);

            const scoreRef = useRef(0);
            const userDataRef = useRef(userData);
            
            useEffect(() => { scoreRef.current = score; }, [score]);
            useEffect(() => { userDataRef.current = userData; }, [userData]);

            // --- Multiplayer (Duel) States ---
            const [mpSetup, setMpSetup] = useState({ p1Name: 'Pemain Kiri', p2Name: 'Pemain Kanan', level: 2, timeLimit: 300 });
            const [mpState, setMpState] = useState({
                p1: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                p2: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                timer: 300, winner: null
            });

            // --- Firebase Init ---
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'batik-matika-v-responsive';
            
            useEffect(() => {
                if (!firebaseConfig) { setView('landing'); return; }
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else { await signInAnonymously(auth); }
                    } catch (error) { console.error("Auth error", error); setView('landing'); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) {
                        setView('landing');
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            signInWithCustomToken(auth, __initial_auth_token).catch(console.error);
                        } else { 
                            signInAnonymously(auth).catch(console.error); 
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !firebaseConfig) return;
                const db = getFirestore();
                
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const unsubProfile = onSnapshot(profileRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.isLoggedOut) {
                            setView('landing');
                        } else {
                            setUserData(data);
                            setView(v => (v === 'loading' || v === 'login' || v === 'landing') ? 'menu' : v);
                        }
                    } else { setView('landing'); }
                });

                // Papan Peringkat Murni
                const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const unsubLb = onSnapshot(lbRef, (snap) => {
                    const rawData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    const uniquePlayersMap = new Map();
                    rawData.forEach(player => {
                        if (!player.name || player.name.toLowerCase().trim() === 'anonim') return;
                        
                        const key = `${player.name}_${player.school}_${player.province}`.toLowerCase().trim();
                        if (!uniquePlayersMap.has(key) || uniquePlayersMap.get(key).points < (player.points || 0)) {
                            uniquePlayersMap.set(key, player);
                        }
                    });
                    
                    const data = Array.from(uniquePlayersMap.values());
                    data.sort((a, b) => (b.points || 0) - (a.points || 0));
                    setLeaderboardData(data);
                }, (err) => console.error("Leaderboard Error:", err));

                return () => { unsubProfile(); unsubLb(); };
            }, [user]);

            // --- Listener Resolusi Layar ---
            useEffect(() => {
                const handleResize = () => {
                    setIsMobile(window.innerWidth < 1024);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // --- SISTEM SATU PINTU LOGIKA POIN ---
            const addPoints = async (amount) => {
                if (amount <= 0 || !user || !firebaseConfig) return;
                const db = getFirestore();
                
                const currentData = userDataRef.current || {};
                const newTotalPoints = (currentData.points || 0) + amount;

                setUserData(prev => ({ ...prev, points: newTotalPoints }));

                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                
                const pName = currentData.name || loginForm.name || 'Anonim';
                const pSchool = currentData.school || loginForm.school || '-';
                const pProv = currentData.province || loginForm.province || '-';
                const pKey = getPlayerKey(pName, pSchool, pProv);
                
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                
                try {
                    const batch = writeBatch(db);
                    
                    batch.set(profileRef, { 
                        points: increment(amount), 
                        updatedAt: serverTimestamp() 
                    }, { merge: true });
                    
                    batch.set(publicRef, {
                        name: pName,
                        school: pSchool,
                        province: pProv,
                        unlockedLevel: currentData.unlockedLevel || 1,
                        avatar: currentData.activeAvatar || 'default',
                        points: increment(amount), 
                        updatedAt: serverTimestamp()
                    }, { merge: true });

                    await batch.commit();
                } catch (e) { console.error("Point Sync Error", e); }
            };

            const deductPointsSync = async (cost, additionalData) => {
                if (!user || !firebaseConfig) return;
                const db = getFirestore();
                
                const currentData = userDataRef.current || {};
                const newTotalPoints = Math.max(0, (currentData.points || 0) - cost);

                setUserData(prev => ({ ...prev, points: newTotalPoints, ...additionalData }));

                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const pName = currentData.name || loginForm.name || 'Anonim';
                const pSchool = currentData.school || loginForm.school || '-';
                const pProv = currentData.province || loginForm.province || '-';
                const pKey = getPlayerKey(pName, pSchool, pProv);
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);

                try {
                    const batch = writeBatch(db);
                    
                    batch.set(profileRef, { 
                        ...additionalData, 
                        points: increment(-cost), 
                        updatedAt: serverTimestamp() 
                    }, { merge: true });
                    
                    const lbUpdates = { 
                        points: increment(-cost), 
                        updatedAt: serverTimestamp() 
                    };
                    if (additionalData.activeAvatar) lbUpdates.avatar = additionalData.activeAvatar;
                    
                    batch.set(publicRef, lbUpdates, { merge: true });

                    await batch.commit();
                } catch (e) { console.error("Deduct Sync Error", e); }
            };

            const saveUserData = async (newData) => {
                if (!user || !firebaseConfig) { setUserData(prev => ({ ...prev, ...newData })); return; }
                const db = getFirestore();
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, { ...newData, updatedAt: serverTimestamp() }, { merge: true });
                } catch (e) { console.error("Save Data Error", e); }
            };

            const handleSaveAndExit = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                if(scoreRef.current > 0) await addPoints(scoreRef.current);
                setScore(0);
                setIsSyncing(false);
                setView('map');
            };

            const handleSaveAndReplay = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                if(scoreRef.current > 0) await addPoints(scoreRef.current);
                setScore(0);
                setIsSyncing(false);
                startGame(activeBatik.id, level);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginForm.name || !loginForm.school || !loginForm.province) {
                    alert("Harap lengkapi Nama, Sekolah, dan Provinsi!");
                    return;
                }

                const pKey = getPlayerKey(loginForm.name, loginForm.school, loginForm.province);
                
                let recoveredPoints = 0;
                let recoveredLevel = 1;
                let recoveredAvatar = 'default';

                if (user && firebaseConfig) {
                    const db = getFirestore();
                    const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                    try {
                        const docSnap = await getDoc(publicRef);
                        if (docSnap.exists()) {
                            const pastData = docSnap.data();
                            recoveredPoints = pastData.points || 0;
                            recoveredLevel = pastData.unlockedLevel || 1;
                            recoveredAvatar = pastData.avatar || 'default';
                        }
                    } catch (err) {
                        console.error("Gagal mengambil data lama:", err);
                    }
                }

                const initData = { 
                    name: loginForm.name, school: loginForm.school, province: loginForm.province, 
                    points: recoveredPoints, unlockedLevel: recoveredLevel, 
                    activeAvatar: recoveredAvatar, ownedAvatars: ['default', recoveredAvatar],
                    ownedBatiks: [], powerups: { bomb: 3, hint: 5 },
                    isLoggedOut: false 
                };
                
                await saveUserData(initData);
                setView('menu');
            };

            const handleLogout = async () => {
                if (user && firebaseConfig) {
                    const db = getFirestore();
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, { isLoggedOut: true }, { merge: true }); 
                }
                setUserData(null);
                setLoginForm({ name: '', province: '', school: '' });
                setScore(0);
                setView('landing');
            };

            const buyAvatar = (avatar) => {
                const currentPoints = userData?.points || 0;
                if (currentPoints >= avatar.price) {
                    const newOwned = [...(userData?.ownedAvatars || ['default']), avatar.id];
                    deductPointsSync(avatar.price, { ownedAvatars: newOwned, activeAvatar: avatar.id });
                    alert(`Berhasil mendapatkan Profil ${avatar.name}!`);
                } else { alert("Poin kamu belum cukup untuk mendapatkan profil ini."); }
            };

            const equipAvatar = (avatarId) => { 
                saveUserData({ activeAvatar: avatarId }); 
                deductPointsSync(0, { activeAvatar: avatarId });
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                    setIsFullscreen(true);
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); setIsFullscreen(false); }
                }
            };

            const generateQuestion = (lvl) => {
                let types = ['add'];
                if (lvl >= 2) types.push('sub'); 
                if (lvl >= 3) types.push('mul', 'div'); 
                
                const type = types[Math.floor(Math.random() * types.length)];
                let n1, n2, ans, text;
                
                if (type === 'add') {
                    n1 = Math.floor(Math.random() * (10 + lvl * 10)) + (5 * lvl); 
                    n2 = Math.floor(Math.random() * (10 + lvl * 10)) + 5;
                    ans = n1 + n2; text = `${n1} + ${n2}`;
                } else if (type === 'sub') {
                    n1 = Math.floor(Math.random() * (20 + lvl * 10)) + (10 * lvl); 
                    n2 = Math.floor(Math.random() * n1) + 1;
                    ans = n1 - n2; text = `${n1} - ${n2}`;
                } else if (type === 'mul') {
                    const maxFactor = 4 + lvl; 
                    n1 = Math.floor(Math.random() * maxFactor) + 2; 
                    n2 = Math.floor(Math.random() * maxFactor) + 2;
                    ans = n1 * n2; text = `${n1} × ${n2}`;
                } else {
                    const maxDivisor = 3 + lvl; 
                    n2 = Math.floor(Math.random() * maxDivisor) + 2; 
                    ans = Math.floor(Math.random() * 10) + 2;
                    n1 = n2 * ans; text = `${n1} ÷ ${n2}`;
                }
                return { text, ans };
            };

            const generateGrid = (lvl) => {
                return Array(16).fill(null).map((_, i) => ({
                    id: i, active: true, isSpecial: Math.random() > 0.85, q: generateQuestion(lvl)
                }));
            };

            // EFEK PENGGANTIAN MOTIF OTOMATIS SAAT MAIN
            useEffect(() => {
                if (view === 'game') {
                    const currentTotal = (userData?.points || 0) + score;
                    const islandBatiks = BATIKS.filter(b => b.islandId === level).sort((a, b) => b.price - a.price);
                    const highestBatik = islandBatiks.find(b => currentTotal >= b.price);
                    
                    if (highestBatik && highestBatik.id !== activeBatik.id && highestBatik.price > activeBatik.price) {
                        setActiveBatik(highestBatik);
                        setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `🌟 Motif ${highestBatik.name} Terbuka! 🌟`, x: window.innerWidth / 2, y: window.innerHeight / 2 }]);
                    }
                }
            }, [score, userData?.points, level, view, activeBatik.id, activeBatik.price]);

            useEffect(() => {
                if (view === 'game') {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                setView('gameover');
                                return 0;
                            }
                            return prev - 1;
                        });
                        setFeverTimer(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [view]);

            const startGame = (batikId, selectedLvl) => {
                const batik = BATIKS.find(b => b.id === batikId);
                setActiveBatik(batik);
                setLevel(selectedLvl); 
                setScore(0); setCombo(0); setLives(3);
                setTimeLeft(60 + (selectedLvl * 5)); 
                setFeverTimer(0);
                
                setPowerups(userDataRef.current?.powerups || { bomb: 3, hint: 5 });
                setGrid(generateGrid(selectedLvl)); setSelectedBlock(null);
                setView('game');
            };

            const submitAnswer = (e) => {
                if (!selectedBlock) return;
                const isCorrect = parseInt(inputAnswer) === selectedBlock.q.ans;
                const btnRect = e?.target?.getBoundingClientRect();
                const x = btnRect ? btnRect.left + btnRect.width / 2 : window.innerWidth / 2;
                const y = btnRect ? btnRect.top : window.innerHeight / 2;

                if (isCorrect) {
                    setFeedback('correct');
                    const newCombo = combo + 1; 
                    setCombo(newCombo);
                    
                    let isTriggeringFever = false;
                    let currentFever = feverTimer;
                    if (newCombo === 5 && currentFever === 0) {
                        setFeverTimer(10);
                        currentFever = 10;
                        isTriggeringFever = true;
                        setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `🔥 BATIK FEVER! 🔥`, x: window.innerWidth/2, y: 150 }]);
                    }

                    let earned = activeBatik.baseScore;
                    if (selectedBlock.isSpecial) earned *= 2;
                    if (newCombo > 2) earned += (newCombo * 10);
                    if (currentFever > 0) earned *= 3;
                    
                    setScore(s => s + earned);
                    setTimeLeft(prev => prev + 3);
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `+${earned} (+3s)`, x, y: y - 50 }]);

                    setTimeout(() => {
                        const newGrid = [...grid];
                        newGrid[newGrid.findIndex(b => b.id === selectedBlock.id)].active = false;
                        setGrid(newGrid); setSelectedBlock(null); setFeedback(null); setInputAnswer('');
                        
                        if (newGrid.filter(b => b.active).length === 0) {
                            const bonus = timeLeft * 10 + lives * 50; 
                            const totalLevelScore = score + bonus + earned; 
                            setScore(totalLevelScore); 
                            
                            const currentUnlocked = userDataRef.current?.unlockedLevel || 1;
                            const nextLevel = level + 1;
                            if (nextLevel > currentUnlocked && nextLevel <= ISLANDS.length) {
                                saveUserData({ unlockedLevel: nextLevel });
                            }
                            setView('win'); 
                        }
                    }, 500);

                } else {
                    setFeedback('wrong'); setCombo(0); setLives(l => l - 1); setFeverTimer(0);
                    setTimeLeft(prev => Math.max(0, prev - 5));
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `❌ -5 Detik`, x, y: y - 50 }]);
                    setTimeout(() => { 
                        setFeedback(null); 
                        setInputAnswer(''); 
                        if (lives <= 1) {

                        } 
                    }, 800);

                                    <div className="w-px h-8 lg:h-10 bg-slate-600"></div>
                                    <div className={`flex items-center gap-2 px-2 py-1.5 lg:px-3 lg:py-2 rounded-xl border shadow-inner ${isFever ? 'bg-rose-900 border-rose-500' : 'bg-slate-900 border-slate-700'}`}>
                                        <Clock className={`w-4 h-4 lg:w-6 lg:h-6 ${timeLeft <= 10 ? 'text-rose-500 animate-pulse' : 'text-amber-400'}`}/>
                                        <span className={`font-black text-lg lg:text-2xl leading-none ${timeLeft <= 10 && !isFever ? 'text-rose-500' : 'text-slate-100'}`}>{timeLeft}s</span>
                                    </div>
                                </div>
                            </div>

                            {isFever && (
                                <div className="w-full max-w-3xl mx-auto bg-black/50 rounded-full h-1.5 lg:h-2 mb-2 overflow-hidden backdrop-blur-sm border border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.8)] shrink-0 relative z-10">
                                    <div className="h-full bg-gradient-to-r from-yellow-300 to-yellow-500 shadow-[0_0_10px_#fff]" style={{ width: `${(feverTimer/10)*100}%`, transition: 'width 1s linear' }}></div>
                                </div>
                            )}

                            {/* Main Content: Kiri Grid, Kanan Numpad */}
                            <div className="flex-1 flex flex-row items-center justify-center gap-6 lg:gap-12 w-full min-h-0 z-10 px-4">
                                
                                {/* KIRI: Grid Batu Segel */}
                                <div className={`shadow-[0_10px_40px_rgba(0,0,0,0.5)] relative border-4 lg:border-8 rounded-[1.5rem] lg:rounded-[2rem] p-2 lg:p-3 aspect-square shrink-0 ${isFever ? 'bg-orange-600 border-yellow-500' : 'bg-slate-800 border-slate-600'} transition-all duration-300`} style={{ height: 'min(60vh, 500px)' }}>
                                    <div className="absolute inset-2 lg:inset-3 rounded-xl bg-cover bg-center opacity-90 transition-all duration-1000 ease-in-out" style={{ backgroundImage: `url("${activeBatik.bgImage}")`}}></div>
                                    <div className="grid grid-cols-4 grid-rows-4 gap-1.5 lg:gap-2 w-full h-full relative z-10">
                                        {grid.map(b => (
                                            <button key={b.id} 
                                                onPointerDown={(e) => { e.preventDefault(); if(b.active) { setSelectedBlock(b); setInputAnswer(''); setFeedback(null); }}}
                                                className={`rounded-lg lg:rounded-xl transition-all transform flex items-center justify-center font-bold text-xl lg:text-3xl select-none backdrop-blur-sm
                                                    ${!b.active ? 'opacity-0 pointer-events-none scale-90' : 'opacity-100 scale-100 shadow-[0_4px_0_rgba(0,0,0,0.5)] active:translate-y-1'}
                                                    ${selectedBlock?.id === b.id ? 'ring-4 ring-yellow-400 animate-pulse z-20' : ''}
                                                    ${b.isSpecial ? 'bg-gradient-to-br from-yellow-400 to-amber-600 text-white border border-yellow-300' : (isFever ? 'bg-gradient-to-br from-rose-500 to-orange-500 border border-orange-300 text-white' : 'bg-slate-700/95 text-slate-400 border border-slate-500')}`}>
                                                {b.active && (b.isSpecial ? <span className="drop-shadow-md">★</span> : <span className="opacity-50">?</span>)}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* KANAN: Numpad Panel */}
                                <div className="w-[340px] lg:w-[400px] flex flex-col shrink-0" style={{ height: 'min(60vh, 500px)' }}>
                                    {selectedBlock ? (
                                        <div className="bg-gradient-to-b from-indigo-900 to-slate-900 rounded-[2rem] p-5 lg:p-6 shadow-[0_0_30px_rgba(79,70,229,0.3)] border-4 border-indigo-500/50 flex flex-col w-full h-full animate-bounce-in relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-full h-full bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,0.2)_0%,transparent_60%)] pointer-events-none"></div>
                                            
                                            <div className="flex justify-between items-center mb-4 lg:mb-6 relative z-10 shrink-0">
                                                <button onPointerDown={(e) => { e.preventDefault(); setSelectedBlock(null); }} className="text-indigo-200 bg-indigo-950/50 p-2 lg:p-3 rounded-full hover:bg-indigo-800 border border-indigo-500/30 select-none transition-colors"><ArrowLeft className="w-5 h-5 lg:w-6 lg:h-6"/></button>
                                                <div className="text-center flex-1 mx-2">
                                                    <p className="text-[10px] lg:text-xs font-black text-indigo-300 uppercase tracking-widest flex items-center justify-center gap-1"><Zap size={12}/> Segel Terkunci</p>
                                                    <div className="text-3xl lg:text-4xl font-black text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)] flex justify-center items-center gap-3 mt-1 lg:mt-2">
                                                        <span>{selectedBlock.q.text}</span> <span className="text-indigo-400">=</span> <span className={`inline-block min-w-[60px] lg:min-w-[80px] text-center border-b-4 pb-1 rounded-lg bg-black/40 backdrop-blur-sm transition-all ${feedback === 'wrong' ? 'border-rose-500 text-rose-500 shadow-[inset_0_0_10px_rgba(225,29,72,0.5)]' : 'border-emerald-400 text-emerald-400 shadow-[inset_0_0_10px_rgba(52,211,153,0.3)]'}`}>{inputAnswer || '?'}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div className="flex justify-center gap-2 lg:gap-3 mb-4 lg:mb-6 relative z-10 shrink-0">
                                                <button onPointerDown={(e) => { e.preventDefault(); if(powerups?.hint>0){ setInputAnswer(selectedBlock.q.ans.toString()); setPowerups(p=>({...p, hint: p.hint-1}))} }} disabled={powerups?.hint <= 0} className="flex items-center gap-1.5 lg:gap-2 bg-indigo-950 border border-indigo-500 text-indigo-300 px-3 py-2 lg:px-4 lg:py-2.5 rounded-xl font-bold text-[10px] lg:text-sm disabled:opacity-50 select-none shadow-[0_4px_0_rgb(49,46,129)] active:translate-y-1 active:shadow-none transition-all">
                                                    <Lightbulb className="w-3 h-3 lg:w-4 lg:h-4 text-yellow-400"/> Petunjuk ({powerups?.hint || 0})
                                                </button>
                                                <button onPointerDown={(e) => { e.preventDefault(); if(powerups?.bomb>0){ updateQuestProgress('use_bomb'); setInputAnswer(selectedBlock.q.ans.toString()); setPowerups(p=>({...p, bomb: p.bomb-1})); setTimeout(()=>submitAnswer(e), 100); } }} disabled={powerups?.bomb <= 0} className="flex items-center gap-1.5 lg:gap-2 bg-rose-950 border border-rose-500 text-rose-300 px-3 py-2 lg:px-4 lg:py-2.5 rounded-xl font-bold text-[10px] lg:text-sm disabled:opacity-50 select-none shadow-[0_4px_0_rgb(136,19,55)] active:translate-y-1 active:shadow-none transition-all">
                                                    <Bomb className="w-3 h-3 lg:w-4 lg:h-4 text-rose-400"/> Bom ({powerups?.bomb || 0})
                                                </button>
                                            </div>
                                            
                                            <div className="mt-auto relative z-10 w-full flex-1 flex flex-col justify-end min-h-0">
                                                {renderNumpad(inputAnswer, setInputAnswer, submitAnswer, false, false)}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center bg-slate-800/50 rounded-[2.5rem] border-4 border-dashed border-slate-600 p-8 animate-pulse-slow">
                                            <Search className="text-indigo-400 w-12 h-12 lg:w-16 lg:h-16 mb-4 opacity-80" />
                                            <p className="text-center font-bold text-slate-300 text-base lg:text-lg">Sentuh blok misteri di samping<br/>untuk memecahkan segel!</p>
                                        </div>
                                    )}
                                </div>

                            </div>
                        </div>
                    );
                }

                if (view === 'gameover' || view === 'win') {
                    const isWin = view === 'win';
                    const currentIsland = ISLANDS[level - 1] || ISLANDS[0];
                    return (
                        <div className={`min-h-[100dvh] flex flex-col items-center justify-center p-4 md:p-10 font-nunito ${isWin ? 'bg-green-50' : 'bg-red-50'} overflow-y-auto`}>
                            <style>{`@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap'); .font-nunito { font-family: 'Nunito', sans-serif; }`}</style>
                            <div className="bg-white p-6 md:p-12 rounded-[2rem] md:rounded-[3rem] shadow-2xl max-w-sm md:max-w-2xl w-full text-center border-2 md:border-4 border-gray-100 my-auto">
                                <div className="text-6xl md:text-9xl mb-4 md:mb-8">{isWin ? '🏝️' : (timeLeft <= 0 ? '⏰' : '💥')}</div>
                                <h2 className={`text-2xl md:text-5xl font-black mb-2 md:mb-4 ${isWin ? 'text-green-600' : 'text-red-600'}`}>
                                    {isWin ? `PULAU ${currentIsland.name.toUpperCase()} SELESAI!` : (timeLeft <= 0 ? 'WAKTU HABIS!' : 'YAH, GAGAL...')}
                                </h2>
                                <p className="text-gray-600 font-bold text-xs md:text-xl mb-6 md:mb-10">
                                    {isWin ? 'Luar biasa! Kamu berhasil menaklukkan tantangan di pulau ini.' : 'Poin akan dicatat saat kamu menekan tombol KELUAR di bawah.'}
                                </p>
                                
                                <div className="bg-gray-50 rounded-2xl md:rounded-[2rem] p-4 md:p-8 mb-6 md:mb-10 border-2 border-gray-100">
                                    <p className="text-[10px] md:text-lg font-bold text-gray-400 uppercase tracking-widest mb-1 md:mb-2">Skor Akhir</p>
                                    <p className="text-5xl md:text-8xl font-black text-orange-500">{score}</p>
                                </div>

                                <div className="flex flex-col md:flex-row gap-3 md:gap-4">
                                    {!isWin && (
                                        <button onClick={handleSaveAndReplay} disabled={isSyncing} className={`flex-1 bg-orange-500 text-white py-3 md:py-5 rounded-xl md:rounded-2xl font-black text-sm md:text-xl shadow-[0_4px_0_rgb(194,65,12)] hover:bg-orange-600 active:shadow-none active:translate-y-1 transition-all ${isSyncing ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                            {isSyncing ? 'MENYIMPAN...' : 'ULANGI LEVEL'}
                                        </button>
                                    )}
                                    <button onClick={handleSaveAndExit} disabled={isSyncing} className={`flex-1 bg-gray-800 text-white py-3 md:py-5 rounded-xl md:rounded-2xl font-black text-sm md:text-xl shadow-[0_4px_0_rgb(17,24,39)] hover:bg-gray-900 active:shadow-none active:translate-y-1 transition-all ${isSyncing ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                        {isSyncing ? 'MENYIMPAN...' : 'KELUAR & SIMPAN'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (view === 'skin-select') {
                    const currentPoints = userData?.points || 0;
                    const currentIsland = ISLANDS[level - 1] || ISLANDS[0];
                    const islandBatiks = BATIKS.filter(b => b.islandId === level);

                    return (
                        <div className="min-h-[100dvh] w-full bg-gray-50 p-4 md:p-8 font-nunito flex flex-col items-center justify-start overflow-y-auto">
                            <FullscreenButton />
                            <div className="w-full max-w-lg md:max-w-4xl lg:max-w-6xl py-8 mt-4 md:my-auto">
                                <div className="flex flex-row items-center gap-3 md:gap-6 mb-6 md:mb-12 bg-white p-3 md:p-6 rounded-[1.5rem] md:rounded-[2rem] shadow-sm">
                                    <button onClick={() => setView('map')} className="p-2 md:p-4 bg-gray-100 rounded-full shadow-sm text-gray-600 hover:bg-gray-200"><ArrowLeft className="w-5 h-5 md:w-7 md:h-7"/></button>
                                    <div>
                                        <h2 className="text-xl md:text-4xl font-black text-gray-800">Motif {currentIsland.name}</h2>
                                        <p className="font-bold text-gray-500 mt-0.5 md:mt-1 text-xs md:text-base">Pilih motif batik daerah untuk dimainkan</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-8">
                                    {islandBatiks.map(b => {
                                        const isOwned = currentPoints >= b.price;
                                        return (
                                            <div key={b.id} 
                                                onClick={() => { if(isOwned) startGame(b.id, level) }}
                                                className={`p-4 md:p-6 rounded-2xl md:rounded-[2rem] border-2 md:border-4 text-left flex flex-col items-start gap-3 md:gap-4 transition-all ${isOwned ? 'bg-white border-indigo-200 hover:border-indigo-500 shadow-md hover:shadow-xl md:hover:-translate-y-2 cursor-pointer' : 'bg-slate-100 border-slate-200 opacity-90 grayscale'}`}>
                                                <div className="w-full aspect-[4/3] rounded-xl md:rounded-2xl bg-gray-200 overflow-hidden relative" style={{ backgroundImage: `url("${b.bgImage}")`, backgroundSize: 'cover', backgroundPosition: 'center' }}>
                                                    {!isOwned && <div className="absolute inset-0 bg-black/50 flex items-center justify-center backdrop-blur-sm"><Lock className="w-8 h-8 md:w-12 md:h-12 text-white opacity-90"/></div>}
                                                </div>
                                                <div className="w-full flex-1 flex flex-col justify-between">
                                                    <div>
                                                        <h3 className="font-black text-lg md:text-3xl text-gray-800 mb-0.5 md:mb-1">{b.name}</h3>
                                                        <p className="text-xs md:text-base font-bold text-gray-400 mb-3 md:mb-4">{b.mathConcept}</p>
                                                    </div>
                                                    
                                                    {isOwned ? (
                                                        <span className="text-xs md:text-base font-black bg-emerald-100 text-emerald-600 px-3 py-2 md:px-4 md:py-3 rounded-lg md:rounded-xl flex items-center justify-center w-full">Mainkan Motif</span>
                                                    ) : (
                                                        <div className="px-3 py-2 md:px-4 md:py-3 rounded-lg md:rounded-xl font-black text-xs md:text-base flex items-center justify-between w-full bg-slate-200 text-slate-500 cursor-not-allowed">
                                                            <span className="flex items-center gap-1 md:gap-2"><Lock className="w-3 h-3 md:w-4 md:h-4"/> Terkunci</span>
                                                            <span>Butuh {b.price.toLocaleString()} Poin</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                }

                return <div className="p-4 text-center font-nunito">Memuat Komponen Game...</div>;
            };

            // Memblokir Layar HP (Kurang dari 1024px)
            if (isMobile) {
                return (
                    <div className="min-h-[100dvh] w-full bg-slate-900 flex flex-col items-center justify-center p-8 text-center font-nunito relative overflow-hidden">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(99,102,241,0.15)_0%,transparent_50%)] animate-pulse-slow pointer-events-none"></div>
                        <div className="text-8xl mb-6 relative z-10 animate-bounce">💻</div>
                        <h1 className="text-3xl md:text-5xl font-black text-white mb-4 relative z-10 drop-shadow-md">Layar Terlalu Kecil!</h1>
                        <div className="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl max-w-lg relative z-10 backdrop-blur-sm shadow-2xl">
                            <p className="text-indigo-200 text-lg md:text-xl font-bold">
                                <b>Batik Matika</b> dirancang khusus untuk dimainkan di <span className="text-yellow-400">Papan Interaktif Digital</span> atau <span className="text-yellow-400">Laptop / PC</span> agar visual petualangan terlihat maksimal.
                                <br/><br/>
                                Silakan buka game ini di perangkat dengan layar yang lebih lebar!
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <React.Fragment>
                    {dailyPopup.show && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-[2rem] p-5 md:p-8 max-w-sm md:max-w-md w-full text-center shadow-2xl transform transition-all animate-bounce-in border-2 md:border-4 border-amber-200">
                                <div className="text-5xl md:text-7xl mb-1 md:mb-2">🎁</div>
                                <h2 className="text-2xl md:text-4xl font-black text-amber-500 mb-1 md:mb-2">Hadiah Harian!</h2>
                                <p className="text-gray-600 font-bold text-xs md:text-base mb-3 md:mb-4">Terima kasih sudah kembali belajar hari ini.</p>
                                
                                <div className="bg-amber-50 rounded-xl md:rounded-2xl p-3 md:p-4 mb-3 md:mb-4 border border-amber-200 flex flex-col items-center">
                                    <div className="flex justify-center items-center gap-1 md:gap-2 mb-0.5 md:mb-1">
                                        <Flame className="text-orange-500 w-5 h-5 md:w-7 md:h-7"/>
                                        <span className="font-black text-orange-600 text-lg md:text-2xl">{dailyPopup.streak} Hari Streak!</span>
                                    </div>
                                    <p className="text-[10px] md:text-sm font-bold text-amber-700/70 uppercase">Bonus Poin Langsung</p>
                                    <p className="text-3xl md:text-5xl font-black text-amber-500">+{dailyPopup.bonus}</p>
                                </div>

                                <div className="text-left bg-teal-50 rounded-xl md:rounded-2xl p-3 md:p-4 mb-4 md:mb-6 border border-teal-100">
                                    <p className="text-xs md:text-sm font-black text-teal-700 uppercase tracking-widest mb-2 flex items-center gap-1.5 md:gap-2">
                                        <CalendarCheck className="w-4 h-4 md:w-5 md:h-5"/> Misi Hari Ini
                                    </p>
                                    <ul className="space-y-2 md:space-y-3">
                                        {dailyPopup.quests.slice(0, 3).map((q, i) => (
                                            <li key={i} className="flex items-start gap-1.5 md:gap-2 text-[10px] md:text-sm font-bold text-gray-700">
                                                <span className="text-teal-500 shrink-0">❖</span> 
                                                <span className="flex-1 leading-tight">{q.title}</span> 
                                                <span className="text-orange-500 bg-orange-100 px-1.5 py-0.5 rounded text-[8px] md:text-xs whitespace-nowrap shrink-0">+{q.reward} Poin</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <button 
                                    onClick={() => setDailyPopup({ ...dailyPopup, show: false })}
                                    className="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white py-3 md:py-4 rounded-lg md:rounded-xl font-black text-base md:text-xl shadow-[0_4px_0_rgb(180,83,9)] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wider"
                                >
                                    Siap Berpetualang!
                                </button>
                            </div>
                        </div>
                    )}
                    {renderView()}
                </React.Fragment>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
