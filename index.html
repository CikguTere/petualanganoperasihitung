<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batik Matika - Petualangan Numerasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling & Optimasi Sentuhan untuk Layar Interaktif */
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111827; /* gray-900 */
            -webkit-tap-highlight-color: transparent;
        }
        .font-nunito {
            font-family: 'Nunito', sans-serif;
        }

        /* Animasi Kustom */
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.2); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Custom Scrollbar untuk Papan Peringkat */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        .dir-rtl { direction: rtl; }
    </style>

    <!-- Babel Standalone untuk kompilasi JSX di Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map untuk mengatasi Module Resolving -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- Script Utama Game (React + Firebase) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, signOut } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp, increment } from 'firebase/firestore';
        import { Play, Users, Trophy, ArrowLeft, Heart, Zap, Lock, School, Clock, Lightbulb, Bomb, Maximize, Minimize, Swords, User, MapPin, Medal, Flame, Map as MapIcon, ChevronRight, CalendarCheck, CheckCircle2, LogOut } from 'lucide-react';

        // ==========================================
        // 1. DATA & KONFIGURASI
        // ==========================================

        const AVATARS = [
            { id: 'default', icon: '👤', name: 'Standar', price: 0 },
            { id: 'owl', icon: '🦉', name: 'Burung Hantu', price: 1000 },
            { id: 'fox', icon: '🦊', name: 'Rubah Cerdik', price: 2500 },
            { id: 'tiger', icon: '🐯', name: 'Harimau Berani', price: 4000 },
            { id: 'panda', icon: '🐧', name: 'Panda Santai', price: 5000 },
            { id: 'dragon', icon: '🐉', name: 'Naga Emas', price: 10000 },
        ];

        const QUEST_TEMPLATES = [
            { id: 'q_solo', type: 'play_solo', target: 2, reward: 500, title: 'Main 2x Mode Solo' },
            { id: 'q_duel', type: 'play_duel', target: 1, reward: 800, title: 'Main 1x Mode Duel' },
            { id: 'q_bomb', type: 'use_bomb', target: 1, reward: 300, title: 'Gunakan 1x Bom' },
            { id: 'q_correct', type: 'answer_correct', target: 20, reward: 1000, title: 'Jawab 20 Soal Benar' },
        ];

        const BATIKS = [
            { id: 'siger', islandId: 1, name: 'Mahkota Siger', price: 0, mathConcept: 'Geometri: Simetri Lipat', pattern: 'siger', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 100 },
            { id: 'durianpecah', islandId: 1, name: 'Durian Pecah', price: 1000, mathConcept: 'Pecahan & Sudut', pattern: 'durian', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 150 },
            { id: 'ikantumbal', islandId: 1, name: 'Ikan Tumbal', price: 3000, mathConcept: 'Translasi Bangun', pattern: 'ikan', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 200 },
            { id: 'kawung', islandId: 2, name: 'Kawung', price: 0, mathConcept: 'Pola Lingkaran Berpotongan', pattern: 'circles', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 150 },
            { id: 'megamendung', islandId: 2, name: 'Megamendung', price: 2000, mathConcept: 'Kurva & Skala Bertingkat', pattern: 'clouds', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 200 },
            { id: 'parang', islandId: 2, name: 'Parang Rusak', price: 4500, mathConcept: 'Garis Sejajar & Gradien', pattern: 'diagonal', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 250 },
            { id: 'batanggaring', islandId: 3, name: 'Batang Garing', price: 0, mathConcept: 'Pohon Faktor (Perkalian)', pattern: 'tree', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 200 },
            { id: 'mandau', islandId: 3, name: 'Mandau', price: 2500, mathConcept: 'Garis Tegak Lurus', pattern: 'sword', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 250 },
            { id: 'singabarong', islandId: 4, name: 'Singa Barong', price: 0, mathConcept: 'Rotasi Bangun Datar', pattern: 'lion', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 250 },
            { id: 'ulundanu', islandId: 4, name: 'Ulun Danu', price: 3000, mathConcept: 'Refleksi Sumbu X', pattern: 'temple', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 300 },
            { id: 'kudasumba', islandId: 5, name: 'Kuda Sumba', price: 0, mathConcept: 'Deret Aritmatika', pattern: 'horse', bgImage: 'https://images.unsplash.com/photo-1605808360022-7711d9ceeb07?auto=format&fit=crop&q=80&w=600', baseScore: 300 },
            { id: 'mamuli', islandId: 5, name: 'Mamuli Rote', price: 4000, mathConcept: 'Geometri Fraktal', pattern: 'jewelry', bgImage: 'https://images.unsplash.com/photo-1583089851608-592f6c8d76db?auto=format&fit=crop&q=80&w=600', baseScore: 350 },
        ];

        const ISLANDS = [
            { id: 1, name: "Sumatra", desc: "Penjumlahan Dasar", icon: "🌴", color: "from-emerald-400 to-green-600", align: "justify-start" },
            { id: 2, name: "Jawa", desc: "Penjumlahan & Pengurangan", icon: "🌋", color: "from-blue-400 to-indigo-600", align: "justify-end" },
            { id: 3, name: "Kalimantan", desc: "Pengenalan Perkalian", icon: "🦧", color: "from-amber-400 to-orange-600", align: "justify-start" },
            { id: 4, name: "Bali", desc: "Operasi Pembagian", icon: "🌺", color: "from-pink-400 to-rose-600", align: "justify-end" },
            { id: 5, name: "NTT", desc: "Ujian Maestro Nusantara", icon: "🦎", color: "from-purple-400 to-violet-600", align: "justify-center" },
        ];

        const RANKS = [
            { min: 0, title: "Pemula Batik", color: "text-slate-600", bg: "bg-slate-100" },
            { min: 1000, title: "Pengrajin Muda", color: "text-green-600", bg: "bg-green-100" },
            { min: 5000, title: "Ahli Canting", color: "text-blue-600", bg: "bg-blue-100" },
            { min: 15000, title: "Maestro Batik", color: "text-purple-600", bg: "bg-purple-100" },
        ];

        // ==========================================
        // 2. HELPER COMPONENTS & ANIMATIONS
        // ==========================================

        const getPlayerKey = (name, school, province) => {
            const safeName = (name || 'anonim').toLowerCase().replace(/[^a-z0-9]/g, '');
            const safeSchool = (school || '-').toLowerCase().replace(/[^a-z0-9]/g, '');
            const safeProv = (province || '-').toLowerCase().replace(/[^a-z0-9]/g, '');
            return `${safeName}_${safeSchool}_${safeProv}`;
        };

        const FloatingText = ({ text, x, y, onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(onComplete, 1000);
                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <div className="absolute z-50 text-xl md:text-3xl lg:text-4xl font-black text-white pointer-events-none drop-shadow-lg whitespace-nowrap"
                     style={{ left: x, top: y, animation: 'floatUp 1s ease-out forwards', textShadow: '0 2px 4px rgba(0,0,0,0.5)', transform: 'translateX(-50%)' }}>
                    {text}
                </div>
            );
        };

        const CantingEmas = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <path d="M4 20L11 13" stroke="#B45309" strokeWidth="3" strokeLinecap="round"/>
                <circle cx="15" cy="9" r="5" fill="#FBBF24" stroke="#B45309" strokeWidth="2"/>
                <path d="M19 7C20.5 5.5 22 6 23 8" stroke="#FBBF24" strokeWidth="2.5" strokeLinecap="round"/>
            </svg>
        );

        // ==========================================
        // 3. MAIN COMPONENT
        // ==========================================

        function App() {
            // --- Global States ---
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [leaderboardData, setLeaderboardData] = useState([]);
            const [view, setView] = useState('loading');
            const [loginForm, setLoginForm] = useState({ name: '', province: '', school: '' });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [dailyPopup, setDailyPopup] = useState({ show: false, streak: 0, bonus: 0, quests: [] });
            
            const timerRef = useRef(null);
            
            // --- Single Player States ---
            const [activeBatik, setActiveBatik] = useState(BATIKS[0]);
            const [level, setLevel] = useState(1);
            const [grid, setGrid] = useState([]);
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(60); 
            const [feverTimer, setFeverTimer] = useState(0); 
            const [lives, setLives] = useState(3);
            const [combo, setCombo] = useState(0);
            const [selectedBlock, setSelectedBlock] = useState(null);
            const [inputAnswer, setInputAnswer] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [powerups, setPowerups] = useState({ bomb: 3, hint: 5 }); 
            const [floatingTexts, setFloatingTexts] = useState([]);

            const scoreRef = useRef(0);
            const userDataRef = useRef(userData);
            
            useEffect(() => { scoreRef.current = score; }, [score]);
            useEffect(() => { userDataRef.current = userData; }, [userData]);

            // --- Multiplayer (Duel) States ---
            const [mpSetup, setMpSetup] = useState({ p1Name: 'Pemain Atas', p2Name: 'Pemain Bawah', level: 2, timeLimit: 300 });
            const [mpState, setMpState] = useState({
                p1: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                p2: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                timer: 300, winner: null
            });

            // --- Firebase Init ---
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'batik-matika-v-responsive';
            
            useEffect(() => {
                if (!firebaseConfig) { setView('landing'); return; }
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else { await signInAnonymously(auth); }
                    } catch (error) { console.error("Auth error", error); setView('landing'); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) {
                        setView('landing');
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            signInWithCustomToken(auth, __initial_auth_token).catch(console.error);
                        } else { 
                            signInAnonymously(auth).catch(console.error); 
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !firebaseConfig) return;
                const db = getFirestore();
                
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const unsubProfile = onSnapshot(profileRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.isLoggedOut) {
                            setView('landing');
                        } else {
                            setUserData(data);
                            checkDailyLogin(data);
                            setView(v => (v === 'loading' || v === 'login' || v === 'landing') ? 'menu' : v);
                        }
                    } else { setView('landing'); }
                });

                // Papan Peringkat Murni
                const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const unsubLb = onSnapshot(lbRef, (snap) => {
                    const rawData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    const uniquePlayersMap = new Map();
                    rawData.forEach(player => {
                        if (!player.name || player.name.toLowerCase().trim() === 'anonim') return;
                        
                        const key = `${player.name}_${player.school}_${player.province}`.toLowerCase().trim();
                        if (!uniquePlayersMap.has(key) || uniquePlayersMap.get(key).points < (player.points || 0)) {
                            uniquePlayersMap.set(key, player);
                        }
                    });
                    
                    const data = Array.from(uniquePlayersMap.values());
                    data.sort((a, b) => (b.points || 0) - (a.points || 0));
                    setLeaderboardData(data);
                }, (err) => console.error("Leaderboard Error:", err));

                return () => { unsubProfile(); unsubLb(); };
            }, [user]);

            // --- SISTEM SATU PINTU LOGIKA POIN ---
            const addPoints = async (amount) => {
                if (amount <= 0 || !user || !firebaseConfig) return;
                const db = getFirestore();
                
                const currentData = userDataRef.current || {};
                const newTotalPoints = (currentData.points || 0) + amount;

                setUserData(prev => ({ ...prev, points: newTotalPoints }));

                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                
                const pName = currentData.name || loginForm.name || 'Anonim';
                const pSchool = currentData.school || loginForm.school || '-';
                const pProv = currentData.province || loginForm.province || '-';
                const pKey = getPlayerKey(pName, pSchool, pProv);
                
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                
                try {
                    await setDoc(profileRef, { points: newTotalPoints, updatedAt: serverTimestamp() }, { merge: true });
                    await setDoc(publicRef, {
                        name: pName,
                        school: pSchool,
                        province: pProv,
                        unlockedLevel: currentData.unlockedLevel || 1,
                        avatar: currentData.activeAvatar || 'default',
                        points: newTotalPoints, 
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                } catch (e) { console.error("Point Sync Error", e); }
            };

            const saveUserData = async (newData) => {
                if (!user || !firebaseConfig) { setUserData(prev => ({ ...prev, ...newData })); return; }
                const db = getFirestore();
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, { ...newData, updatedAt: serverTimestamp() }, { merge: true });
                } catch (e) { console.error("Save Data Error", e); }
            };

            const checkDailyLogin = (data) => {
                const today = new Date().toDateString();
                const yesterdayDate = new Date();
                yesterdayDate.setDate(yesterdayDate.getDate() - 1);
                const yesterday = yesterdayDate.toDateString();

                let updates = {};
                let needUpdate = false;
                let showPopup = false;
                let currentStreak = data.loginStreak || 0;
                let currentBonus = 0;
                let currentQuests = data.quests || QUEST_TEMPLATES.map(q => ({ ...q, progress: 0, claimed: false }));

                if (data.lastLoginDate !== today) {
                    updates.lastLoginDate = today;
                    if (data.lastLoginDate === yesterday) { currentStreak += 1; } else { currentStreak = 1; }
                    updates.loginStreak = currentStreak;
                    currentBonus = currentStreak * 50;
                    
                    showPopup = true;
                    needUpdate = true;
                }

                if (data.lastQuestDate !== today) {
                    updates.lastQuestDate = today;
                    currentQuests = QUEST_TEMPLATES.map(q => ({ ...q, progress: 0, claimed: false }));
                    updates.quests = currentQuests;
                    needUpdate = true;
                }

                if (needUpdate) {
                    saveUserData(updates);
                    if (currentBonus > 0) setTimeout(() => addPoints(currentBonus), 500);
                }
                if (showPopup) setDailyPopup({ show: true, streak: currentStreak, bonus: currentBonus, quests: currentQuests });
            };

            const updateQuestProgress = (questType, amount = 1) => {
                const currentData = userDataRef.current;
                if (!currentData || !currentData.quests) return;
                let hasChanges = false;
                const newQuests = currentData.quests.map(q => {
                    if (q.type === questType && !q.claimed && q.progress < q.target) {
                        hasChanges = true;
                        return { ...q, progress: Math.min(q.target, q.progress + amount) };
                    }
                    return q;
                });
                if (hasChanges) saveUserData({ quests: newQuests });
            };

            const claimQuest = (questId) => {
                const currentData = userDataRef.current;
                if (!currentData) return;
                const questIndex = currentData.quests.findIndex(q => q.id === questId);
                if (questIndex === -1) return;
                const quest = currentData.quests[questIndex];
                
                if (quest.progress >= quest.target && !quest.claimed) {
                    const newQuests = [...currentData.quests];
                    newQuests[questIndex].claimed = true;
                    saveUserData({ quests: newQuests });
                    addPoints(quest.reward); 
                    alert(`🎉 Misi Selesai!\nMendapat +${quest.reward} Poin.`);
                }
            };

            const handleSaveAndExit = () => {
                if(scoreRef.current > 0) addPoints(scoreRef.current);
                setScore(0);
                setView('map');
            };

            const handleSaveAndReplay = () => {
                if(scoreRef.current > 0) addPoints(scoreRef.current);
                setScore(0);
                startGame(activeBatik.id, level);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginForm.name || !loginForm.school || !loginForm.province) {
                    alert("Harap lengkapi Nama, Sekolah, dan Provinsi!");
                    return;
                }

                const pKey = getPlayerKey(loginForm.name, loginForm.school, loginForm.province);
                const pastRecord = leaderboardData.find(p => p.id === pKey);

                const recoveredPoints = pastRecord?.points || 0;
                const recoveredLevel = pastRecord?.unlockedLevel || 1;
                const recoveredAvatar = pastRecord?.avatar || 'default';

                const initData = { 
                    name: loginForm.name, school: loginForm.school, province: loginForm.province, 
                    points: recoveredPoints, unlockedLevel: recoveredLevel, 
                    activeAvatar: recoveredAvatar, ownedAvatars: ['default', recoveredAvatar],
                    ownedBatiks: [], powerups: { bomb: 3, hint: 5 },
                    lastLoginDate: null, lastQuestDate: null, 
                    isLoggedOut: false 
                };
                
                await saveUserData(initData);
                setView('menu');
            };

            const handleLogout = async () => {
                if (user && firebaseConfig) {
                    const db = getFirestore();
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, { isLoggedOut: true }, { merge: true }); 
                }
                setUserData(null);
                setDailyPopup({ show: false, streak: 0, bonus: 0, quests: [] });
                setLoginForm({ name: '', province: '', school: '' });
                setScore(0);
                setView('landing');
            };

            const buyBatik = (batik) => {
                const currentPoints = userData?.points || 0;
                if (currentPoints >= batik.price) {
                    const newPoints = currentPoints - batik.price;
                    const newOwned = [...(userData?.ownedBatiks || []), batik.id];
                    saveUserData({ points: newPoints, ownedBatiks: newOwned });
                    addPoints(0); 
                    alert(`Berhasil membuka Motif ${batik.name}!`);
                } else { alert("Poin kamu belum cukup untuk membeli motif ini."); }
            };

            const buyAvatar = (avatar) => {
                const currentPoints = userData?.points || 0;
                if (currentPoints >= avatar.price) {
                    const newPoints = currentPoints - avatar.price;
                    const newOwned = [...(userData?.ownedAvatars || ['default']), avatar.id];
                    saveUserData({ points: newPoints, ownedAvatars: newOwned, activeAvatar: avatar.id });
                    addPoints(0); 
                    alert(`Berhasil mendapatkan Profil ${avatar.name}!`);
                } else { alert("Poin kamu belum cukup untuk mendapatkan profil ini."); }
            };

            const equipAvatar = (avatarId) => { saveUserData({ activeAvatar: avatarId }); };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                    setIsFullscreen(true);
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); setIsFullscreen(false); }
                }
            };

            const generateQuestion = (lvl) => {
                let types = ['add'];
                if (lvl >= 2) types.push('sub'); 
                if (lvl >= 3) types.push('mul'); 
                if (lvl >= 4) types.push('div'); 
                
                const type = types[Math.floor(Math.random() * types.length)];
                let n1, n2, ans, text;
                
                if (type === 'add') {
                    n1 = Math.floor(Math.random() * (10 + lvl * 10)) + (5 * lvl); 
                    n2 = Math.floor(Math.random() * (10 + lvl * 10)) + 5;
                    ans = n1 + n2; text = `${n1} + ${n2}`;
                } else if (type === 'sub') {
                    n1 = Math.floor(Math.random() * (20 + lvl * 10)) + (10 * lvl); 
                    n2 = Math.floor(Math.random() * n1) + 1;
                    ans = n1 - n2; text = `${n1} - ${n2}`;
                } else if (type === 'mul') {
                    const maxFactor = 4 + lvl; 
                    n1 = Math.floor(Math.random() * maxFactor) + 2; 
                    n2 = Math.floor(Math.random() * maxFactor) + 2;
                    ans = n1 * n2; text = `${n1} × ${n2}`;
                } else {
                    const maxDivisor = 3 + lvl; 
                    n2 = Math.floor(Math.random() * maxDivisor) + 2; 
                    ans = Math.floor(Math.random() * 10) + 2;
                    n1 = n2 * ans; text = `${n1} ÷ ${n2}`;
                }
                return { text, ans };
            };

            const generateGrid = (lvl) => {
                return Array(16).fill(null).map((_, i) => ({
                    id: i, active: true, isSpecial: Math.random() > 0.85, q: generateQuestion(lvl)
                }));
            };

            useEffect(() => {
                if (view === 'game') {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                updateQuestProgress('play_solo'); 
                                setView('gameover');
                                return 0;
                            }

                        });
                        setFeverTimer(prev => (prev > 0 ? prev - 1 : 0));

            const startGame = (batikId, selectedLvl) => {
                const batik = BATIKS.find(b => b.id === batikId);
                setActiveBatik(batik);

            const submitAnswer = (e) => {
                if (!selectedBlock) return;
                const isCorrect = parseInt(inputAnswer) === selectedBlock.q.ans;
                const btnRect = e?.target?.getBoundingClientRect();
                const x = btnRect ? btnRect.left + btnRect.width / 2 : window.innerWidth / 2;
                const y = btnRect ? btnRect.top : window.innerHeight / 2;

                if (isCorrect) {
                    setFeedback('correct');
                    const newCombo = combo + 1; 
                    setCombo(newCombo);
                    updateQuestProgress('answer_correct'); 
                    
                    let isTriggeringFever = false;
                    let currentFever = feverTimer;
                    if (newCombo === 5 && currentFever === 0) {
                        setFeverTimer(10);
                        currentFever = 10;
                        isTriggeringFever = true;
                        setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `🔥 BATIK FEVER! 🔥`, x: window.innerWidth/2, y: 150 }]);
                    }

                    let earned = activeBatik.baseScore;
                    if (selectedBlock.isSpecial) earned *= 2;
                    if (newCombo > 2) earned += (newCombo * 10);
                    if (currentFever > 0) earned *= 3;
                    
                    setScore(s => s + earned);
                    setTimeLeft(prev => prev + 3);
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `+${earned} (+3s)`, x, y: y - 50 }]);

                    setTimeout(() => {
                        const newGrid = [...grid];
                        newGrid[newGrid.findIndex(b => b.id === selectedBlock.id)].active = false;
                        setGrid(newGrid); setSelectedBlock(null); setFeedback(null); setInputAnswer('');
                        
                        if (newGrid.filter(b => b.active).length === 0) {
                            const bonus = timeLeft * 10 + lives * 50; 
                            const totalLevelScore = score + bonus + earned; 
                            setScore(totalLevelScore); 
                            
                            updateQuestProgress('play_solo');

                            }

                    }, 500);

                } else {
                    setFeedback('wrong'); setCombo(0); setLives(l => l - 1); setFeverTimer(0);

                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `❌ -5 Detik`, x, y: y - 50 }]);
                    setTimeout(() => { 
                        setFeedback(null); 
                        setInputAnswer('');

                            setView('gameover');

                    return (

                                <h2 className="text-2xl md:text-4xl font-black text-amber-500 mb-1 md:mb-2">Hadiah Harian!</h2>

                                <div className="bg-amber-50 rounded-xl md:rounded-2xl p-3 md:p-4 mb-3 md:mb-4 border border-amber-200 flex flex-col items-center">

                                        <Flame className="text-orange-500 w-5 h-5 md:w-7 md:h-7"/>
                                        <span className="font-black text-orange-600 text-lg md:text-2xl">{dailyPopup.streak} Hari Streak!</span>
                                    </div>
                                    <p className="text-[10px] md:text-sm font-bold text-amber-700/70 uppercase">Bonus Poin Langsung</p>
                                    <p className="text-3xl md:text-5xl font-black text-amber-500">+{dailyPopup.bonus}</p>
                                </div>

                                <div className="text-left bg-teal-50 rounded-xl md:rounded-2xl p-3 md:p-4 mb-4 md:mb-6 border border-teal-100">
                                    <p className="text-xs md:text-sm font-black text-teal-700 uppercase tracking-widest mb-2 flex items-center gap-1.5 md:gap-2">
                                        <CalendarCheck className="w-4 h-4 md:w-5 md:h-5"/> Misi Hari Ini
                                    </p>
                                    <ul className="space-y-2 md:space-y-3">
                                        {dailyPopup.quests.slice(0, 3).map((q, i) => (
                                            <li key={i} className="flex items-start gap-1.5 md:gap-2 text-[10px] md:text-sm font-bold text-gray-700">
                                                <span className="text-teal-500 shrink-0">❖</span> 
                                                <span className="flex-1 leading-tight">{q.title}</span> 
                                                <span className="text-orange-500 bg-orange-100 px-1.5 py-0.5 rounded text-[8px] md:text-xs whitespace-nowrap shrink-0">+{q.reward} Poin</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <button 
                                    onClick={() => setDailyPopup({ ...dailyPopup, show: false })}
                                    className="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white py-3 md:py-4 rounded-lg md:rounded-xl font-black text-base md:text-xl shadow-[0_4px_0_rgb(180,83,9)] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wider"
                                >
                                    Siap Berpetualang!
                                </button>
                            </div>
                        </div>
                    )}
                    {renderView()}
                </React.Fragment>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
