        const CharacterAvatar = ({ gender, clothesId, size = "large" }) => {
            const clothes = CLOTHES.find(c => c.id === clothesId) || CLOTHES[0];
            const contSize = size === "large" ? "w-56 h-64 md:w-80 md:h-96" : "w-16 h-20 md:w-24 md:h-32";

            const [rotY, setRotY] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const lastX = useRef(0);

            const handlePointerDown = (e) => { setIsDragging(true); lastX.current = e.clientX; e.target.setPointerCapture(e.pointerId); };
            const handlePointerMove = (e) => { if (!isDragging) return; const delta = e.clientX - lastX.current; setRotY(prev => prev + delta * 0.8); lastX.current = e.clientX; };
            const handlePointerUp = (e) => { setIsDragging(false); e.target.releasePointerCapture(e.pointerId); };

            return (
                <div 
                    className={`relative flex flex-col items-center justify-center animate-bounce-in ${contSize} cursor-grab active:cursor-grabbing`}
                    style={{ perspective: '1000px' }} 
                    onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}
                >
                    <div className="w-full h-full transition-transform" style={{ transform: `rotateY(${rotY}deg)`, transformStyle: 'preserve-3d', transitionDuration: isDragging ? '0ms' : '150ms' }}>

        // ==========================================

        function App() {
            // --- Global States ---
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [view, setView] = useState('loading');
            const [loginForm, setLoginForm] = useState({ name: '', province: '', school: '', gender: 'boy' });
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [dailyPopup, setDailyPopup] = useState({ show: false, streak: 0, bonus: 0, quests: [] });
            const [showOrientationPrompt, setShowOrientationPrompt] = useState(false);
            const [showCard, setShowCard] = useState(false); 
            
            // --- Mobile Blocker State ---
            const [isMobile, setIsMobile] = useState(window.innerWidth < 300);
            
            // --- State Carousel Pakaian Batik ---
            const [currentClothesIndex, setCurrentClothesIndex] = useState(0);
            const cardRef = useRef(null); 
            const [isDownloading, setIsDownloading] = useState(false);

            const nextClothes = () => setCurrentClothesIndex((prev) => (prev + 1) % CLOTHES.length);
            const prevClothes = () => setCurrentClothesIndex((prev) => (prev - 1 + CLOTHES.length) % CLOTHES.length);

            // --- Audio States ---
            const audioRef = useRef(null);
            const [isMuted, setIsMuted] = useState(false);

            const triggerAudio = () => { if (audioRef.current && !isMuted) audioRef.current.play().catch(e => console.log(e)); };
            const timerRef = useRef(null);
            
            // --- Single Player States ---
            const [activeBatik, setActiveBatik] = useState(BATIKS[0]);
            const [level, setLevel] = useState(1);
            const [grid, setGrid] = useState([]);
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(60); 
            const [feverTimer, setFeverTimer] = useState(0); 
            const [lives, setLives] = useState(3);
            const [combo, setCombo] = useState(0);
            const [selectedBlock, setSelectedBlock] = useState(null);
            const [inputAnswer, setInputAnswer] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [powerups, setPowerups] = useState({ bomb: 3, hint: 5 }); 
            const [floatingTexts, setFloatingTexts] = useState([]);

            const scoreRef = useRef(0);
            const userDataRef = useRef(userData);
            
            useEffect(() => { scoreRef.current = score; }, [score]);
            useEffect(() => { userDataRef.current = userData; }, [userData]);

            // --- Multiplayer (Duel) States ---
            const [mpSetup, setMpSetup] = useState({ p1Name: 'Pemain Kiri', p2Name: 'Pemain Kanan', level: 2, timeLimit: 300 });
            const [mpState, setMpState] = useState({
                p1: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                p2: { score: 0, lives: 3, grid: [], activeBlock: null, input: '', feedback: null },
                timer: 300, winner: null
            });

            // --- Firebase Init ---
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'batik-matika-v-responsive';
            
            useEffect(() => {
                if (!firebaseConfig) { setView('landing'); return; }
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else { await signInAnonymously(auth); }
                    } catch (error) { console.error("Auth error", error); setView('landing'); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) {
                        setView('landing');
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            signInWithCustomToken(auth, __initial_auth_token).catch(console.error);
                        } else { 
                            signInAnonymously(auth).catch(console.error); 
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !firebaseConfig) return;
                const db = getFirestore();
                
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const unsubProfile = onSnapshot(profileRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.isLoggedOut) {
                            setView('landing');
                        } else {
                            setUserData(data);
                            checkDailyLogin(data);
                            setView(v => (v === 'loading' || v === 'landing' || v === 'login') ? 'menu' : v);
                        }
                    } else { setView('landing'); }
                });

                return () => { unsubProfile(); };
            }, [user]);

            // --- Audio Logic ---
            useEffect(() => {
                const bgMusic = new window.Audio('https://github.com/user-attachments/files/27427020/tatamusic-game-gaming-minecraft-background-music-377647.mp3');
                bgMusic.loop = true;
                bgMusic.volume = 0.3;
                audioRef.current = bgMusic;

                const attemptPlay = () => {
                    if (audioRef.current && !audioRef.current.muted) {
                        const playPromise = audioRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                window.removeEventListener('click', attemptPlay);
                                window.removeEventListener('touchstart', attemptPlay);
                                window.removeEventListener('keydown', attemptPlay);
                            }).catch(e => console.log("Autoplay ditahan browser:", e));
                        }
                    }
                };

                attemptPlay();
                window.addEventListener('click', attemptPlay);
                window.addEventListener('touchstart', attemptPlay);
                window.addEventListener('keydown', attemptPlay);

                return () => {
                    if (audioRef.current) {
                        audioRef.current.pause();
                        audioRef.current.src = '';
                    }
                    window.removeEventListener('click', attemptPlay);
                    window.removeEventListener('touchstart', attemptPlay);
                    window.removeEventListener('keydown', attemptPlay);
                };
            }, []);

            useEffect(() => {
                if (audioRef.current) { audioRef.current.muted = isMuted; }
            }, [isMuted]);

            // --- SISTEM PENYIMPANAN LOGIKA POIN & ASET (Dengan Guard Offline) ---
            const addPoints = async (amount) => {
                if (amount <= 0) return;
                
                const currentData = userDataRef.current || {};
                const newTotalPoints = (currentData.points || 0) + amount;
                setUserData(prev => ({ ...prev, points: newTotalPoints }));

                if (!user || !firebaseConfig) return; // Guard untuk Github Pages
                
                const db = getFirestore();
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const pName = currentData.name || loginForm.name || 'Anonim';
                const pSchool = currentData.school || loginForm.school || '-';
                const pProv = currentData.province || loginForm.province || '-';
                const pKey = getPlayerKey(pName, pSchool, pProv);
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                
                try {
                    const batch = writeBatch(db);
                    batch.set(profileRef, { points: increment(amount), updatedAt: serverTimestamp() }, { merge: true });
                    batch.set(publicRef, {
                        name: pName, school: pSchool, province: pProv,
                        unlockedLevel: currentData.unlockedLevel || 1, 
                        activeClothes: currentData.activeClothes || 'polos',
                        ownedClothes: currentData.ownedClothes || ['polos'],
                        gender: currentData.gender || 'boy',
                        points: increment(amount), updatedAt: serverTimestamp()
                    }, { merge: true });
                    await batch.commit();
                } catch (e) { console.error("Point Sync Error", e); }
            };

            const deductPointsSync = async (cost, additionalData) => {
                const currentData = userDataRef.current || {};
                const newTotalPoints = Math.max(0, (currentData.points || 0) - cost);
                setUserData(prev => ({ ...prev, points: newTotalPoints, ...additionalData }));

                if (!user || !firebaseConfig) return; // Guard untuk Github Pages
                
                const db = getFirestore();
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                const pName = currentData.name || loginForm.name || 'Anonim';
                const pSchool = currentData.school || loginForm.school || '-';
                const pProv = currentData.province || loginForm.province || '-';
                const pKey = getPlayerKey(pName, pSchool, pProv);
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);

                try {
                    const batch = writeBatch(db);
                    batch.set(profileRef, { ...additionalData, points: increment(-cost), updatedAt: serverTimestamp() }, { merge: true });
                    
                    const lbUpdates = { points: increment(-cost), updatedAt: serverTimestamp() };
                    if (additionalData.activeClothes) lbUpdates.activeClothes = additionalData.activeClothes;
                    if (additionalData.ownedClothes) lbUpdates.ownedClothes = additionalData.ownedClothes;
                    if (additionalData.gender) lbUpdates.gender = additionalData.gender;
                    
                    batch.set(publicRef, lbUpdates, { merge: true });
                    await batch.commit();
                } catch (e) { console.error("Deduct Sync Error", e); }
            };

            const saveUserData = async (newData) => {
                setUserData(prev => ({ ...prev, ...newData }));
                
                if (!user || !firebaseConfig) return; // Guard untuk Github Pages

                const db = getFirestore();
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    const batch = writeBatch(db);
                    batch.set(profileRef, { ...newData, updatedAt: serverTimestamp() }, { merge: true });

                    const currentData = userDataRef.current || {};
                    const pName = currentData.name || loginForm.name || 'Anonim';
                    const pSchool = currentData.school || loginForm.school || '-';
                    const pProv = currentData.province || loginForm.province || '-';
                    const pKey = getPlayerKey(pName, pSchool, pProv);

                    if (newData.unlockedLevel || newData.activeClothes || newData.ownedClothes || newData.gender) {
                        const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                        const pubUpdates = { updatedAt: serverTimestamp() };
                        if (newData.unlockedLevel) pubUpdates.unlockedLevel = newData.unlockedLevel;
                        if (newData.activeClothes) pubUpdates.activeClothes = newData.activeClothes;
                        if (newData.ownedClothes) pubUpdates.ownedClothes = newData.ownedClothes;
                        if (newData.gender) pubUpdates.gender = newData.gender;
                        
                        pubUpdates.name = pName;
                        pubUpdates.school = pSchool;
                        pubUpdates.province = pProv;

                        batch.set(publicRef, pubUpdates, { merge: true });
                    }
                    
                    await batch.commit();
                } catch (e) { console.error("Save Data Error", e); }
            };

            const checkDailyLogin = (data) => {
                const today = new Date().toDateString();
                const yesterdayDate = new Date();
                yesterdayDate.setDate(yesterdayDate.getDate() - 1);
                const yesterday = yesterdayDate.toDateString();

                let updates = {};
                let needUpdate = false;
                let showPopup = false;
                let currentStreak = data.loginStreak || 0;
                let currentBonus = 0;
                let currentQuests = data.quests || QUEST_TEMPLATES.map(q => ({ ...q, progress: 0, claimed: false }));

                if (data.lastLoginDate !== today) {
                    updates.lastLoginDate = today;
                    if (data.lastLoginDate === yesterday) { currentStreak += 1; } else { currentStreak = 1; }
                    updates.loginStreak = currentStreak;
                    currentBonus = currentStreak * 50;
                    showPopup = true;
                    needUpdate = true;
                }

                if (data.lastQuestDate !== today) {
                    updates.lastQuestDate = today;
                    currentQuests = QUEST_TEMPLATES.map(q => ({ ...q, progress: 0, claimed: false }));
                    updates.quests = currentQuests;
                    needUpdate = true;
                }

                if (needUpdate) {
                    saveUserData(updates);
                    if (currentBonus > 0) setTimeout(() => addPoints(currentBonus), 500);
                }
                if (showPopup) setDailyPopup({ show: true, streak: currentStreak, bonus: currentBonus, quests: currentQuests });
            };

            const updateQuestProgress = (questType, amount = 1) => {
                const currentData = userDataRef.current;
                if (!currentData || !currentData.quests) return;
                let hasChanges = false;
                const newQuests = currentData.quests.map(q => {
                    if (q.type === questType && !q.claimed && q.progress < q.target) {
                        hasChanges = true;
                        return { ...q, progress: Math.min(q.target, q.progress + amount) };
                    }
                    return q;
                });
                if (hasChanges) saveUserData({ quests: newQuests });
            };

            const claimQuest = (questId) => {
                const currentData = userDataRef.current;
                if (!currentData) return;
                const questIndex = currentData.quests.findIndex(q => q.id === questId);
                if (questIndex === -1) return;
                const quest = currentData.quests[questIndex];
                
                if (quest.progress >= quest.target && !quest.claimed) {
                    const newQuests = [...currentData.quests];
                    newQuests[questIndex].claimed = true;
                    saveUserData({ quests: newQuests });
                    addPoints(quest.reward); 
                    alert(`🎉 Misi Selesai!\nMendapat +${quest.reward} Poin.`);
                }
            };

            const handleSaveAndExit = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                if(scoreRef.current > 0) await addPoints(scoreRef.current);
                setScore(0);
                setIsSyncing(false);
                setView('menu');
            };

            const handleSaveAndReplay = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                if(scoreRef.current > 0) await addPoints(scoreRef.current);
                setScore(0);
                setIsSyncing(false);
                startGame(activeBatik.id, level);
            };

            const handleSaveAndNext = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                if(scoreRef.current > 0) await addPoints(scoreRef.current);
                setScore(0);
                setIsSyncing(false);
                
                const islandBatiks = BATIKS.filter(b => b.islandId === level);
                const currentIndex = islandBatiks.findIndex(b => b.id === activeBatik.id);
                
                if (currentIndex >= 0 && currentIndex < islandBatiks.length - 1) {
                    const nextBatik = islandBatiks[currentIndex + 1];
                    startGame(nextBatik.id, level);
                } else {
                    setView('map');
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginForm.name || !loginForm.school || !loginForm.province) {
                    alert("Harap lengkapi Nama, Sekolah, dan Provinsi!");
                    return;
                }

                triggerAudio();
                
                let recoveredPoints = 0;
                let recoveredLevel = 1;
                let recoveredClothes = 'polos';
                let recoveredOwnedClothes = ['polos'];
                let recoveredGender = loginForm.gender;

                // Guard jika dijalankan di Github Pages / Tanpa Konfigurasi Firebase
                if (user && firebaseConfig) {
                    try {
                        const db = getFirestore();
                        const pKey = getPlayerKey(loginForm.name, loginForm.school, loginForm.province);
                        const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', pKey);
                        const docSnap = await getDoc(publicRef);
                        if (docSnap.exists()) {
                            const pastData = docSnap.data();
                            recoveredPoints = pastData.points || 0;
                            recoveredLevel = pastData.unlockedLevel || 1;
                            recoveredClothes = pastData.activeClothes || pastData.avatar || 'polos';
                            recoveredOwnedClothes = pastData.ownedClothes || pastData.ownedAvatars || ['polos'];
                            if (pastData.gender) recoveredGender = pastData.gender;
                        }
                    } catch (err) { console.error("Gagal mengambil data lama:", err); }
                }

                const initData = { 
                    name: loginForm.name, school: loginForm.school, province: loginForm.province, 
                    gender: recoveredGender,
                    points: recoveredPoints, unlockedLevel: recoveredLevel, 
                    activeClothes: recoveredClothes, ownedClothes: recoveredOwnedClothes,
                    ownedBatiks: [], powerups: { bomb: 3, hint: 5 },
                    lastLoginDate: null, lastQuestDate: null,
                    isLoggedOut: false 
                };
                
                await saveUserData(initData);
                setView('menu');
            };

            const handleLogout = async () => {
                if (user && firebaseConfig) {
                    try {
                        const db = getFirestore();
                        const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                        await setDoc(profileRef, { isLoggedOut: true }, { merge: true }); 
                    } catch(e) { console.log("Logout Sync Error", e); }
                }
                setUserData(null);
                setLoginForm({ name: '', province: '', school: '', gender: 'boy' });
                setScore(0);
                setView('landing');
            };

            const handleDownloadCard = async () => {
                if (!cardRef.current) return;
                setIsDownloading(true);
                try {
                    const canvas = await window.html2canvas(cardRef.current, {
                        useCORS: true, allowTaint: true, scale: 3, backgroundColor: null
                    });
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = image;
                    link.download = `Kartu_Pahlawan_Batik_${userData.name.replace(/\s+/g, '_')}.png`;
                    link.click();
                } catch (err) {
                    console.error("Gagal mendownload kartu:", err);
                    alert("Gagal mengunduh kartu. Pastikan perangkat Anda mengizinkan proses penyimpanan gambar.");
                }
                setIsDownloading(false);
            };

            const buyClothes = (clothes) => {
                const currentPoints = userData?.points || 0;
                if (currentPoints >= clothes.price) {
                    const newOwned = [...(userData?.ownedClothes || ['polos']), clothes.id];
                    deductPointsSync(clothes.price, { ownedClothes: newOwned, activeClothes: clothes.id });
                } else { alert("Poin kamu belum cukup untuk mendapatkan baju ini."); }
            };

            const equipClothes = (clothesId) => { saveUserData({ activeClothes: clothesId }); };

            const toggleFullscreenAndLock = async () => {
                try {
                    if (!document.fullscreenElement) {
                        await document.documentElement.requestFullscreen().catch(err => console.log(err));
                        setIsFullscreen(true);
                        if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
                            await window.screen.orientation.lock('landscape').catch(e => console.log(e));
                        }
                    } else {
                        if (document.exitFullscreen) { 
                            await document.exitFullscreen().catch(err => console.log(err)); 
                            setIsFullscreen(false); 
                            if (window.screen && window.screen.orientation && window.screen.orientation.unlock) {
                                window.screen.orientation.unlock();
                            }
                        }
                    }
                } catch (err) { console.log(err); }
            };

            const generateQuestion = (lvl) => {
                let types = ['add'];
                if (lvl >= 2) types.push('sub'); 
                if (lvl >= 3) types.push('mul', 'div'); 
                
                const type = types[Math.floor(Math.random() * types.length)];
                let n1, n2, ans, text;
                
                if (type === 'add') {
                    n1 = Math.floor(Math.random() * (10 + lvl * 10)) + (5 * lvl); 
                    n2 = Math.floor(Math.random() * (10 + lvl * 10)) + 5;
                    ans = n1 + n2; text = `${n1} + ${n2}`;
                } else if (type === 'sub') {
                    n1 = Math.floor(Math.random() * (20 + lvl * 10)) + (10 * lvl); 
                    n2 = Math.floor(Math.random() * n1) + 1;
                    ans = n1 - n2; text = `${n1} - ${n2}`;
                } else if (type === 'mul') {
                    const maxFactor = 4 + lvl; 
                    n1 = Math.floor(Math.random() * maxFactor) + 2; 
                    n2 = Math.floor(Math.random() * maxFactor) + 2;
                    ans = n1 * n2; text = `${n1} × ${n2}`;
                } else {
                    const maxDivisor = 3 + lvl; 
                    n2 = Math.floor(Math.random() * maxDivisor) + 2; 
                    ans = Math.floor(Math.random() * 10) + 2;
                    n1 = n2 * ans; text = `${n1} ÷ ${n2}`;
                }
                return { text, ans };
            };

            const generateGrid = (lvl) => {
                return Array(16).fill(null).map((_, i) => ({
                    id: i, active: true, isSpecial: Math.random() > 0.85, q: generateQuestion(lvl)
                }));
            };

            useEffect(() => {
                if (view === 'game') {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                updateQuestProgress('play_solo'); 
                                setView('gameover');
                                return 0;
                            }
                            return prev - 1;
                        });
                        setFeverTimer(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [view]);

            const startGame = (batikId, selectedLvl) => {
                const batik = BATIKS.find(b => b.id === batikId);
                setActiveBatik(batik);
                setLevel(selectedLvl); 
                setScore(0); setCombo(0); setLives(3);
                setTimeLeft(60 + (selectedLvl * 5)); 
                setFeverTimer(0);
                setFloatingTexts([]);
                
                setPowerups(userDataRef.current?.powerups || { bomb: 3, hint: 5 });
                setGrid(generateGrid(selectedLvl)); setSelectedBlock(null);
                setView('game');
            };

            const submitAnswer = (e) => {
                if (!selectedBlock) return;
                const isCorrect = parseInt(inputAnswer) === selectedBlock.q.ans;
                const btnRect = e?.target?.getBoundingClientRect();
                const x = btnRect ? btnRect.left + btnRect.width / 2 : window.innerWidth / 2;
                const y = btnRect ? btnRect.top : window.innerHeight / 2;

                if (isCorrect) {
                    setFeedback('correct');
                    const newCombo = combo + 1; 
                    setCombo(newCombo);
                    updateQuestProgress('answer_correct'); 
                    
                    let isTriggeringFever = false;
                    let currentFever = feverTimer;
                    if (newCombo === 5 && currentFever === 0) {
                        setFeverTimer(10);
                        currentFever = 10;
                        isTriggeringFever = true;
                        setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `🔥 BATIK FEVER! 🔥`, x: window.innerWidth/2, y: 150 }]);
                    }

                    let earned = activeBatik.baseScore;
                    if (selectedBlock.isSpecial) earned *= 2;
                    if (newCombo > 2) earned += (newCombo * 10);
                    if (currentFever > 0) earned *= 3;
                    
                    setScore(s => s + earned);
                    setTimeLeft(prev => prev + 3);
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `+${earned} (+3s)`, x, y: y - 50 }]);

                    setTimeout(() => {
                        const newGrid = [...grid];
                        newGrid[newGrid.findIndex(b => b.id === selectedBlock.id)].active = false;
                        setGrid(newGrid); setSelectedBlock(null); setFeedback(null); setInputAnswer('');
                        
                        if (newGrid.filter(b => b.active).length === 0) {
                            const bonus = timeLeft * 10 + lives * 50; 
                            const totalLevelScore = score + bonus + earned; 
                            setScore(totalLevelScore); 
                            
                            updateQuestProgress('play_solo'); 
                            const currentUnlocked = userDataRef.current?.unlockedLevel || 1;
                            const nextLevel = level + 1;
                            if (nextLevel > currentUnlocked && nextLevel <= ISLANDS.length) {
                                saveUserData({ unlockedLevel: nextLevel });
                            }
                            setView('win'); 
                        }
                    }, 500);

                } else {
                    setFeedback('wrong'); setCombo(0); setLives(l => l - 1); setFeverTimer(0);
                    setTimeLeft(prev => Math.max(0, prev - 5));
                    setFloatingTexts(prev => [...prev, { id: Date.now()+Math.random(), text: `❌ -5 Detik`, x, y: y - 50 }]);
                    setTimeout(() => { 
                        setFeedback(null); 
                        setInputAnswer(''); 
                        if (lives <= 1) { 
                            updateQuestProgress('play_solo'); 
                            setView('gameover'); 
                        } 
                    }, 800);
                }
            };

            const startMultiplayer = () => {
                setMpState({
                    p1: { score: 0, lives: 3, grid: generateGrid(mpSetup.level), activeBlock: null, input: '', feedback: null },
                    p2: { score: 0, lives: 3, grid: generateGrid(mpSetup.level), activeBlock: null, input: '', feedback: null },
                    timer: mpSetup.timeLimit, winner: null
                });
                setView('multiplayer-game');
            };

            useEffect(() => {
                if (view === 'multiplayer-game' && !mpState.winner && mpState.timer > 0) {
                    timerRef.current = setInterval(() => {
                        setMpState(prev => {
                            if (prev.timer <= 1) { 
                                clearInterval(timerRef.current); 
                                updateQuestProgress('play_duel'); 
                                return { ...prev, timer: 0, winner: 'draw' }; 
                            }
                            return { ...prev, timer: prev.timer - 1 };
                        });
                    }, 1000);
                } else { clearInterval(timerRef.current); }
                return () => clearInterval(timerRef.current);
            }, [view, mpState.winner]);

            const submitMpAnswer = (pKey, e) => {
                const player = mpState[pKey];
                if (!player.activeBlock) return;
                const isCorrect = parseInt(player.input) === player.activeBlock.q.ans;
                
                if (isCorrect) {
                    const newGrid = [...player.grid];
                    newGrid[newGrid.findIndex(b => b.id === player.activeBlock.id)].active = false;
                    const isFinished = newGrid.filter(b => b.active).length === 0;
                    
                    setMpState(prev => {
                        let newState = { ...prev, [pKey]: { ...prev[pKey], feedback: 'correct', score: prev[pKey].score + (player.activeBlock.isSpecial ? 200 : 100) } };
                        if (isFinished && !prev.winner) {
                            newState.winner = pKey;
                            updateQuestProgress('play_duel'); 
                        }
                        return newState;
                    });

                    setTimeout(() => {
                        setMpState(prev => ({ ...prev, [pKey]: { ...prev[pKey], grid: newGrid, activeBlock: null, feedback: null, input: '' } }));
                    }, 500);
                } else {
                    setMpState(prev => {
                        const newLives = prev[pKey].lives - 1;
                        let newState = { ...prev, [pKey]: { ...prev[pKey], feedback: 'wrong', lives: newLives } };
                        if (newLives <= 0 && !prev.winner) {
                            newState.winner = pKey === 'p1' ? 'p2' : 'p1';
                            updateQuestProgress('play_duel');

                    const isWin = view === 'win';
                    const currentIsland = ISLANDS[level - 1] || ISLANDS[0];

                                    <button onClick={handleSaveAndExit} disabled={isSyncing} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 md:py-5 rounded-xl md:rounded-2xl font-black text-sm md:text-xl shadow-[0_4px_0_rgb(51,65,85)] hover:scale-[1.02] active:shadow-none active:translate-y-1 transition-all border border-slate-500">
                                        {isSyncing ? 'MENYIMPAN...' : 'KEMBALI KE PODIUM'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                return <div className="p-4 text-center font-nunito">Memuat Komponen Game...</div>;
            };

            return (
                <React.Fragment>
                    {view !== 'loading' && (
                        <button onClick={() => setIsMuted(!isMuted)} className="fixed top-4 left-4 z-[9900] p-2 md:p-3 bg-slate-800/80 backdrop-blur border border-slate-600 text-white rounded-full shadow-lg hover:bg-slate-700 transition-all cursor-pointer">
                            {isMuted ? <VolumeX size={20} className="md:w-6 md:h-6 text-rose-400" /> : <Volume2 size={20} className="md:w-6 md:h-6 text-emerald-400" />}
                        </button>
                    )}

                    {showOrientationPrompt && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                            <div className="bg-slate-800 rounded-[2rem] p-6 md:p-8 max-w-sm w-full text-center shadow-2xl border-2 md:border-4 border-indigo-500/50 animate-bounce-in relative overflow-hidden">
                                <div className="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/20 blur-2xl rounded-full"></div>
                                <div className="text-5xl md:text-7xl mb-3 md:mb-4 relative z-10 drop-shadow-lg">📱<span className="text-indigo-400 mx-2">➡️</span>🖥️</div>
                                <h2 className="text-2xl md:text-3xl font-black text-indigo-400 mb-2 relative z-10">Pengaturan Layar</h2>
                                <p className="text-slate-300 font-bold text-xs md:text-sm mb-6 relative z-10">
                                    Untuk pengalaman bermain terbaik, mari masuk ke mode Layar Penuh dan kunci orientasi menjadi mendatar (Landscape) agar layar tidak berubah saat HP miring.
                                </p>
                                <div className="flex flex-col gap-3 relative z-10">
                                    <button onClick={async () => { await toggleFullscreenAndLock(); setShowOrientationPrompt(false); setView('login'); }} className="w-full bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-400 hover:to-blue-400 text-white py-3 md:py-4 rounded-xl font-black text-sm md:text-lg shadow-[0_4px_0_rgb(49,46,129)] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wider">
                                        Kunci & Lanjutkan
                                    </button>
                                    <button onClick={() => { setShowOrientationPrompt(false); setView('login'); }} className="w-full bg-slate-700 text-slate-300 py-3 rounded-xl font-bold text-xs md:text-sm hover:bg-slate-600 transition-all uppercase">
                                        Lewati (Bermain Biasa)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {dailyPopup.show && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-slate-800 rounded-[2rem] p-5 md:p-8 max-w-sm md:max-w-md w-full text-center shadow-2xl transform transition-all animate-bounce-in border-2 md:border-4 border-amber-500/50 relative overflow-hidden">
                                <div className="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/20 blur-2xl rounded-full"></div>
                                <div className="text-5xl md:text-7xl mb-1 md:mb-2 relative z-10 drop-shadow-lg">🎁</div>
                                <h2 className="text-2xl md:text-4xl font-black text-amber-400 mb-1 md:mb-2 relative z-10">Hadiah Harian!</h2>
                                <p className="text-slate-300 font-bold text-xs md:text-base mb-3 md:mb-4 relative z-10">Terima kasih sudah kembali belajar hari ini.</p>
                                
                                <div className="bg-slate-900 rounded-xl md:rounded-2xl p-3 md:p-4 mb-3 md:mb-4 border border-slate-700 flex flex-col items-center shadow-inner relative z-10">
                                    <div className="flex justify-center items-center gap-1 md:gap-2 mb-0.5 md:mb-1">
                                        <Flame className="text-orange-500 w-5 h-5 md:w-7 md:h-7"/>
                                        <span className="font-black text-orange-500 text-lg md:text-2xl">{dailyPopup.streak} Hari Streak!</span>
                                    </div>
                                    <p className="text-[10px] md:text-sm font-bold text-slate-500 uppercase tracking-widest">Bonus Poin Langsung</p>
                                    <p className="text-3xl md:text-5xl font-black text-amber-400 drop-shadow-md">+{dailyPopup.bonus}</p>
                                </div>

                                <div className="text-left bg-cyan-950/30 rounded-xl md:rounded-2xl p-3 md:p-4 mb-4 md:mb-6 border border-cyan-500/30 relative z-10">
                                    <p className="text-xs md:text-sm font-black text-cyan-400 uppercase tracking-widest mb-2 flex items-center gap-1.5 md:gap-2">
                                        <CalendarCheck className="w-4 h-4 md:w-5 md:h-5"/> Misi Hari Ini
                                    </p>
                                    <ul className="space-y-2 md:space-y-3">
                                        {dailyPopup.quests.slice(0, 3).map((q, i) => (
                                            <li key={i} className="flex items-start gap-1.5 md:gap-2 text-[10px] md:text-sm font-bold text-slate-300">
                                                <span className="text-cyan-400 shrink-0">❖</span> 
                                                <span className="flex-1 leading-tight">{q.title}</span> 
                                                <span className="text-amber-400 bg-amber-500/10 border border-amber-500/20 px-1.5 py-0.5 rounded text-[8px] md:text-xs whitespace-nowrap shrink-0">+{q.reward} Poin</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <button onClick={() => setDailyPopup({ ...dailyPopup, show: false })} className="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-white py-3 md:py-4 rounded-lg md:rounded-xl font-black text-base md:text-xl shadow-[0_4px_0_rgb(180,83,9)] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wider relative z-10">
                                    Ambil Hadiah!
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {renderView()}
                </React.Fragment>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
